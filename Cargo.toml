[workspace]
resolver = "2"
members = [
  "crates/mcp-agent-mail",
  "crates/mcp-agent-mail-core",
  "crates/mcp-agent-mail-db",
  "crates/mcp-agent-mail-storage",
  "crates/mcp-agent-mail-server",
  "crates/mcp-agent-mail-tools",
  "crates/mcp-agent-mail-cli",
  "crates/mcp-agent-mail-guard",
  "crates/mcp-agent-mail-share",
  "crates/mcp-agent-mail-conformance",
  "crates/mcp-agent-mail-search-core",
  "crates/mcp-agent-mail-test-helpers",
]
exclude = ["experimental/*", "crates/mcp-agent-mail-dashboard-wasm"]

[workspace.package]
version = "0.3.31"
edition = "2024"
license = "LicenseRef-MIT-Rider"
license-file = "LICENSE"
rust-version = "1.95"
repository = "https://github.com/Dicklesworthstone/mcp_agent_mail_rust"
authors = ["Jeff Emanuel"]

[workspace.dependencies]
# Required internal dependencies (local projects)
fastmcp = { version = "0.7.1", package = "fastmcp-rust" }
fastmcp-core = "0.7.1"
fastmcp-server = "0.7.1"
fastmcp-transport = "0.7.1"
fastmcp-protocol = "0.7.1"

# br-ba1ui: exact pins keep the shared Asupersync type universe coherent.
# 2026-08-24: =0.4.9, lockstep with fastmcp 0.7.1 (which pins =0.4.9),
# sqlmodel 0.4.0 (^0.4.9), and the fsqlite 0.3.11 registry baseline.
# 0.4.9 is additive on the v0.4.3 public compatibility floor (RuntimeHandle
# request-Cx / blocking-pool APIs, SQLite cancel correctness, owned-OTLP).
asupersync = { version = "=0.4.9", features = ["tls-webpki-roots"] }
fsqlite = "=0.3.11"

sqlmodel = "=0.4.0"
sqlmodel-core = "=0.4.0"
sqlmodel-query = "=0.4.0"
sqlmodel-schema = "=0.4.0"
sqlmodel-session = "=0.4.0"
sqlmodel-pool = "=0.4.0"
sqlmodel-frankensqlite = "=0.4.0"
sqlmodel-sqlite = "=0.4.0"

ftui = "0.5.0"
ftui-runtime = { version = "0.5.0" }
ftui-extras = { version = "0.5.0", features = ["theme", "syntax", "export", "markdown", "charts", "text-effects", "diagram", "forms", "clipboard", "image", "visual-fx"] }
ftui-widgets = { version = "0.5.0", features = ["debug-overlay", "regex-search"] }
ftui-tty = "0.5.0"
ftui-harness = "0.5.0"
ftui-render = "0.5.0"
beads_rust = { version = "0.5.2", default-features = false }
toon = { version = "0.2.3", package = "tru" }
# GH#161: global allocator for the long-running serve-http daemon to avoid
# glibc per-thread arena fragmentation (multi-GB retained RSS under load).
mimalloc = "0.1"

# Internal workspace crates
mcp-agent-mail-core = { path = "crates/mcp-agent-mail-core" }
mcp-agent-mail-db = { path = "crates/mcp-agent-mail-db", default-features = false }
mcp-agent-mail-storage = { path = "crates/mcp-agent-mail-storage", default-features = false }
mcp-agent-mail-server = { path = "crates/mcp-agent-mail-server", default-features = false }
mcp-agent-mail-tools = { path = "crates/mcp-agent-mail-tools", default-features = false }
mcp-agent-mail-cli = { path = "crates/mcp-agent-mail-cli", default-features = false }
mcp-agent-mail-guard = { path = "crates/mcp-agent-mail-guard" }
mcp-agent-mail-share = { path = "crates/mcp-agent-mail-share", default-features = false }
mcp-agent-mail-conformance = { path = "crates/mcp-agent-mail-conformance" }
mcp-agent-mail-search-core = { path = "crates/mcp-agent-mail-search-core" }
mcp-agent-mail-test-helpers = { path = "crates/mcp-agent-mail-test-helpers" }

# Core ecosystem deps
franken-agent-detection = "0.2.2"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9.42"
toml = "1.1.2"
toml_edit = "0.25"
json5 = "1.3.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
web-time = "1.1.0"
comrak = { version = "0.54.0", default-features = false }
include_dir = "0.7.4"
minijinja = "2.15.1"
ammonia = "4.1.2"
regex = "1"
unicode-normalization = "0.1"
same-file = "1"
similar = "3.1.1"
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }
glob = "0.3.3"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4"
base64 = "0.23"
ed25519-dalek = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
criterion = { version = "0.8", features = ["html_reports"] }
loom = "0.7"
proptest = "1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
fs2 = "0.4"
walkdir = "2"
# Tantivy 0.26.1 pins lru 0.16.x, which is affected by RUSTSEC-2026-0253.
# Use the same immutable 0.27 commit as frankensearch; it carries lru 0.18.2.
tantivy = { git = "https://github.com/quickwit-oss/tantivy", rev = "1f32c1a8af0eb9d68bd3f5576caf20941364b657" }
indexmap = "2"
nix = "0.31.3"
rustix = { version = "1.1.4", features = ["fs"] }
url = "2.5.8"
signal-hook = "0.4.4"
winsafe = { version = "=0.0.28", features = ["kernel"] }

# frankensearch: two-tier hybrid search engine + optional cross-encoder rerank.
#
# Do not enable frankensearch's aggregate `hybrid`/`semantic` features here:
# those currently include FastEmbed, which pulls hf-hub/reqwest/hyper/tokio.
# Downstream crates opt into the exact no-Tokio subfeatures they need.
frankensearch = { version = "0.4.0", path = "../frankensearch/frankensearch", default-features = false, features = ["lexical-tantivy"] }
frankensearch-core = { version = "0.2.2", path = "../frankensearch/crates/frankensearch-core" }
frankensearch-embed = { version = "0.2.2", path = "../frankensearch/crates/frankensearch-embed", default-features = false }
frankensearch-index = { version = "0.2.2", path = "../frankensearch/crates/frankensearch-index" }
frankensearch-fusion = { version = "0.2.2", path = "../frankensearch/crates/frankensearch-fusion" }

# Two-tier search dependencies (legacy, being replaced by frankensearch)
half = "2"
wide = "1.5.0"
safetensors = "0.8"
tokenizers = "0.23.1"
rayon = "1"
dirs = "6"
smallvec = { version = "1", features = ["serde"] }

# WASM dependencies
serde-wasm-bindgen = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow early development lints
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# ── Build profiles ──────────────────────────────────────────────────────────

[profile.dev]
opt-level = 1            # Slight optimization for faster test execution
debug = 2                # Full debug info for development

[profile.release]
lto = "thin"             # Cross-crate optimization (80% of full LTO, much faster compile)
codegen-units = 1        # Single codegen unit for maximum optimization
panic = "unwind"         # Keep long-running server workers from aborting the process on panics
opt-level = 3            # Maximum optimization for speed
strip = "symbols"        # Remove debug symbols from production binary

[profile.bench]
inherits = "release"     # Benchmarks use same optimizations as release

[patch.crates-io]
# 2026-08-22 registry adoption (asupersync =0.4.9 universe):
# - asupersync resolves from crates.io (=0.4.9; fastmcp 0.7.1 pins =0.4.9).
# - fsqlite family resolves from crates.io (0.3.11) — the machine-specific
#   /data/projects/frankensqlite path patches are GONE (they broke source
#   builds on any host without that mount).
# - sqlmodel family resolves from crates.io (=0.4.0, published 2026-08-21,
#   accepting asupersync ^0.4.9 + fsqlite ^0.3.7) — the ../sqlmodel-rel-0327
#   cleanup trigger fired, so those eight patch lines are gone too.
# - fastmcp family resolves from crates.io (0.7.1).
#
# beads_rust 0.5.2 stays path-patched to the ../beads_rust checkout because
# that release is not published yet. Keep the requirement, lockfile, sibling
# checkout, and dist workflow's exact source commit in lockstep; Cargo ignores
# a patch whose package version does not satisfy the declared requirement.
# Cleanup trigger: beads_rust 0.5.x published to crates.io.
beads_rust = { path = "../beads_rust" }
# ftui 0.5.0, franken-agent-detection 0.2.2, and tru 0.2.3 resolve from
# crates.io. Their former path patches made builds depend on whatever state
# each machine's sibling checkout happened to be in.
# rich_rust resolves from the registry (0.2.3) as of 2026-08-20 —
# fastmcp-console 0.7.1 pins =0.2.3 and registry 0.2.3 carries the
# time ^0.3.54 req, so the 0.2.2 gated-clone patch is gone.

# --- rch OOM mitigation (2026-07-23) ---------------------------------------
# The 31k-line mcp-agent-mail-server crate needs ~7-10GB/rustc and OOM-kills the
# 15-29GB rch workers, so rch fails the remote build and falls back to a LOCAL
# compile on the trj orchestrator (load spikes + /data/tmp ENOSPC). These per-
# package overrides cut per-rustc peak memory so it builds on the small workers
# instead of flooding trj. Revert = delete this block.
[profile.release.package."mcp-agent-mail-server"]
codegen-units = 16

[profile.dev.package."mcp-agent-mail-server"]
debug = 1
