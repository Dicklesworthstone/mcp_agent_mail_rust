# Historical one-shot patch-landing workflow (br-kp1in.27); retained pending RULE 1 removal approval.
name: Land and verify message-first unified inbox

on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: land-unified-inbox-20261019
  cancel-in-progress: false
jobs:
  land:
    if: github.repository == 'Dicklesworthstone/mcp_agent_mail_rust' && contains(github.event.head_commit.message, '[land-unified-inbox-20261019]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          clean: false
      - name: Apply exact reviewed implementation and restore landing workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/land-atc-reliability-20260918.yml
          parent=crates/mcp-agent-mail-server/src/mail_ui.rs
          module=crates/mcp-agent-mail-server/src/mail_ui/unified.rs
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:$parent)" = 333f1c106fa36007524b17b5e1585bcccacb90f2
          test "$(git rev-parse "HEAD^:$workflow")" = 08cf00c7110244694f1bb692ae8204720c8ac9e9
          test ! -e "$module"
          packed="$RUNNER_TEMP/unified-inbox.patch.gz"
          : > "$packed"
          for blob in 7fde92b8acb1c9619aa327bf973d2671b8075d17 5eefd6433a9e818b872ecc7cfecf3bfda457283c 1564f5086e7ad2ea026a6bc84e6b74fd47c2a18f; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$blob" --jq .content | base64 --decode >> "$packed"
          done
          echo "b5df5e09a17536fe97005898334cdc6c22e1def1d1cac7fd2e4af41ec64aa55c  $packed" | sha256sum --check
          patch="$RUNNER_TEMP/unified-inbox.patch"
          gzip --decompress --stdout "$packed" > "$patch"
          echo "05f61c5f318dfe44ee6a3825daeec3f957d7f80310a80ae5baa992b5fc28e582  $patch" | sha256sum --check
          git apply --recount --check "$patch"
          git apply --recount --index "$patch"
          # Parse both changed Rust sources; format only the new module rather
          # than mixing unrelated parent formatting into this functional batch.
          rustup run stable rustfmt --edition 2024 "$module"
          rustup run stable rustfmt --edition 2024 --config skip_children=true --emit stdout "$parent" > /dev/null
          git show "HEAD^:$workflow" > "$workflow"
          git add -- "$parent" "$module" "$workflow"
          git diff --cached --check
          expected=$(printf '%s\n' "$workflow" "$parent" "$module" | LC_ALL=C sort)
          actual=$(git diff --cached --name-only | LC_ALL=C sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mail-ui): replace per-agent unified inbox fan-out with message-first projection' -m 'Select the global newest window after exact importance and delivery eligibility filtering. Preserve all visible recipient read/ACK state, direct precedence, shared eligibility, operator BCC display and existing thread links. Scan bounded header pages once and hydrate bodies only for final messages through one snapshot and checkout. Retire failed or cancelled checkouts, and keep existing agent-roster selection rather than expanding scope. Add eleven native regressions including a real migrated-mailbox comparison against the original collector and a filter match behind more than 10000 normal deliveries. Header scan work remains history-dependent; no measured speedup or native test pass is claimed by this commit. The following workflow steps record native verification. Restore the original one-shot workflow verbatim.'
          git push origin HEAD:refs/heads/main
          printf 'Functional commit: %s\n' "$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/unified-inbox-result.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain landed sources for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-inbox-landed-sources
          path: |
            crates/mcp-agent-mail-server/src/mail_ui.rs
            crates/mcp-agent-mail-server/src/mail_ui/unified.rs
          retention-days: 7
      - name: Check production feature graph
        shell: bash
        run: |
          set -euo pipefail
          timeout 720 cargo check --locked -p mcp-agent-mail-server --lib 2>&1 | tee "$RUNNER_TEMP/unified-inbox-production.log"
      - name: Run native unified inbox regressions
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 cargo test --locked -p mcp-agent-mail-server --lib mail_ui::unified::tests -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/unified-inbox-tests.log"
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-inbox-native-verification
          path: ${{ runner.temp }}/unified-inbox-*.log
          if-no-files-found: ignore
          retention-days: 7
