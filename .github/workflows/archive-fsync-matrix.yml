name: Archive Fsync Matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-fsync-matrix.yml"
      - "scripts/ci/checkpoint_path_probe.py"
      - "crates/mcp-agent-mail-core/src/disk.rs"
      - "crates/mcp-agent-mail-storage/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/archive-fsync-matrix.yml"
      - "scripts/bench_archive_fsync_matrix.sh"
      - "scripts/ci/checkpoint_path_probe.py"
      - "crates/mcp-agent-mail-core/src/disk.rs"
      - "crates/mcp-agent-mail-storage/**"
      - "benches/BUDGETS.md"
      - "docs/OPERATOR_RUNBOOK.md"
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 2"

concurrency:
  group: archive-fsync-matrix-${{ github.event.pull_request.number || github.ref }}
  # Keep an in-flight native baseline when the next storage fix is pushed.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # GH369: these jobs do not depend on the broad Linux CI job. A format/lint
  # failure elsewhere must not suppress the native Windows filesystem evidence.
  checkpoint-path-diagnostic:
    name: Checkpoint Path Diagnostic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install repository-pinned native compiler
        run: |
          set -euo pipefail
          toolchain=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
      - name: Diagnose real canonical-path metadata and production prefix validation
        run: |
          python scripts/ci/checkpoint_path_probe.py --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/checkpoint-path-probe"
      - name: Preserve native metadata diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkpoint-path-diagnostic-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint-path-probe/
          if-no-files-found: error
          retention-days: 14

  checkpoint-lifecycle:
    name: Checkpoint Lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install repository-pinned native compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint-evidence"
          toolchain=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV | tee "$RUNNER_TEMP/checkpoint-evidence/compiler.log"
          git config --global core.longpaths true
      - name: Require native Windows MSVC and the actual NTFS test volume
        if: always() && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'checkpoint-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $receipt = [ordered]@{
            commit = $env:GITHUB_SHA
            operating_system = [Environment]::OSVersion.VersionString
            compiler = $null
            test_temp_root = $null
            volume = $null
            environment_confirmed = $false
            error = $null
          }
          try {
            $compiler = @(& rustc -vV 2>&1)
            $compilerExit = $LASTEXITCODE
            $receipt.compiler = $compiler -join "`n"
            $compiler | Tee-Object -FilePath (Join-Path $evidence 'windows-compiler.log')
            if ($compilerExit -ne 0) { throw "rustc -vV failed with exit $compilerExit" }
            if ($compiler -notcontains 'host: x86_64-pc-windows-msvc') {
              throw 'Native Windows/MSVC qualification requires an x86_64-pc-windows-msvc host'
            }
            # Ask the same Rust stdlib used by tempfile for its real fixture
            # root; neither RUNNER_TEMP nor a drive-letter guess proves it.
            $source = Join-Path $evidence 'native_temp_probe.rs'
            $executable = Join-Path $evidence 'native_temp_probe.exe'
            @'
          fn main() {
              assert!(cfg!(all(windows, target_env = "msvc")));
              println!("{}", std::env::temp_dir().display());
          }
          '@ | Set-Content -Encoding utf8 $source
            & rustc --edition=2024 --target x86_64-pc-windows-msvc $source -o $executable 2>&1 |
              Tee-Object -FilePath (Join-Path $evidence 'native-temp-compile.log')
            if ($LASTEXITCODE -ne 0) { throw "native temp probe compilation failed: $LASTEXITCODE" }
            $nativeTemp = @(& $executable 2>&1 |
              Tee-Object -FilePath (Join-Path $evidence 'native-temp-run.log'))
            if ($LASTEXITCODE -ne 0 -or $nativeTemp.Count -ne 1) {
              throw 'native temp probe did not return exactly one fixture root'
            }
            $receipt.test_temp_root = $nativeTemp[0]
            $witness = Join-Path $nativeTemp[0] ('gh369-volume-' + [guid]::NewGuid().ToString('N') + '.txt')
            [IO.File]::WriteAllText($witness, 'GH369 native filesystem qualification witness')
            $volumes = @(Get-Volume -FilePath $witness)
            if ($volumes.Count -ne 1) { throw 'Could not resolve the actual fixture volume' }
            $receipt.volume = $volumes[0] | Select-Object Path, FileSystem, DriveType, Size, SizeRemaining
            if ($volumes[0].FileSystem -ne 'NTFS') {
              throw "Native checkpoint qualification requires NTFS, found $($volumes[0].FileSystem)"
            }
            # Keep subsequent Bash/Cargo steps on the exact native temp root
            # measured above, even if a shell supplies its own temp defaults.
            "TMP=$($nativeTemp[0])" | Add-Content -Encoding utf8 $env:GITHUB_ENV
            "TEMP=$($nativeTemp[0])" | Add-Content -Encoding utf8 $env:GITHUB_ENV
            'CARGO_BUILD_TARGET=x86_64-pc-windows-msvc' | Add-Content -Encoding utf8 $env:GITHUB_ENV
            $receipt.environment_confirmed = $true
          } catch {
            $receipt.error = $_.ToString()
            throw
          } finally {
            $receipt | ConvertTo-Json -Depth 5 |
              Tee-Object -FilePath (Join-Path $evidence 'windows-environment.json')
          }
      - uses: Swatinem/rust-cache@v2
      - name: Check production storage feature graph
        run: |
          set -euo pipefail
          cargo check --locked -p mcp-agent-mail-storage --no-default-features --features portable --lib 2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/check-production.log"
      - name: Test native Windows file identity against equal-creation-time replacement
        if: always() && runner.os == 'Windows'
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-core --lib disk::tests::windows_file_identity -- --nocapture 2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/windows-file-identity.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/checkpoint-evidence/windows-file-identity.log"
      - name: Test real canonical and adversarial prefix validation
        if: always()
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --no-default-features --features portable --lib path_prefix_tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/path-prefix.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/checkpoint-evidence/path-prefix.log"
      - name: Test real message checkpoint lifecycle and recovery
        if: always()
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --no-default-features --features portable --lib recovery::message_reconcile::database::checkpoint::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/message-checkpoint.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/checkpoint-evidence/message-checkpoint.log"
      - name: Test adjacent agent checkpoint lifecycle
        if: always()
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --no-default-features --features portable --lib recovery::agent_reconcile::retry::checkpoint::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/agent-checkpoint.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/checkpoint-evidence/agent-checkpoint.log"
      - name: Test adjacent active reservation checkpoint lifecycle
        if: always()
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --no-default-features --features portable --lib recovery::active_reservations::retry::checkpoint::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/active-checkpoint.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/checkpoint-evidence/active-checkpoint.log"
      - name: Test adjacent terminal reservation checkpoint lifecycle
        if: always()
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --no-default-features --features portable --lib recovery::reservation_reconcile::retry::checkpoint::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/checkpoint-evidence/reservation-checkpoint.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/checkpoint-evidence/reservation-checkpoint.log"
      - name: Verify qualification left the sources unchanged
        if: always()
        run: git diff --exit-code
      - name: Preserve every completed and failed lifecycle gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkpoint-lifecycle-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint-evidence/
          if-no-files-found: error
          retention-days: 14

  linux-fsync:
    if: github.event_name != 'push'
    name: Archive Fsync (${{ matrix.fs }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4-ordered, ext4-journal, xfs, btrfs, tmpfs]
    env:
      MATRIX_OUTPUT_DIR: tests/artifacts/perf/archive_fsync_matrix/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.fs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install filesystem tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y btrfs-progs e2fsprogs xfsprogs

      - name: Run archive fsync matrix probe
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/bench_archive_fsync_matrix.sh
          scripts/bench_archive_fsync_matrix.sh \
            --filesystem "${{ matrix.fs }}" \
            --output-dir "${MATRIX_OUTPUT_DIR}"

      - name: Upload archive fsync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-fsync-${{ matrix.fs }}
          path: ${{ env.MATRIX_OUTPUT_DIR }}/
          retention-days: 30
          if-no-files-found: error

  macos-apfs:
    if: github.event_name != 'push'
    name: Archive Fsync (apfs)
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      MATRIX_OUTPUT_DIR: tests/artifacts/perf/archive_fsync_matrix/${{ github.run_id }}-${{ github.run_attempt }}/apfs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Run archive fsync matrix probe
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/bench_archive_fsync_matrix.sh
          scripts/bench_archive_fsync_matrix.sh \
            --filesystem apfs \
            --output-dir "${MATRIX_OUTPUT_DIR}"

      - name: Upload archive fsync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-fsync-apfs
          path: ${{ env.MATRIX_OUTPUT_DIR }}/
          retention-days: 30
          if-no-files-found: error
