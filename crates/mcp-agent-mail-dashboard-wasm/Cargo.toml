[package]
name = "mcp-agent-mail-dashboard-wasm"
version = "0.3.24"
edition = "2024"
license-file = "../../LICENSE"
rust-version = "1.95"
repository = "https://github.com/Dicklesworthstone/mcp_agent_mail_rust"
authors = ["Jeff Emanuel"]
description = "Portable real Agent Mail dashboard runner for browser WASM"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["browser-dashboard"]
browser-dashboard = []
exporter = [
  "browser-dashboard",
  "dep:sqlmodel-sqlite",
  "dep:clap",
  "dep:same-file",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
ftui = { path = "../../../frankentui/crates/ftui" }
ftui-runtime = { path = "../../../frankentui/crates/ftui-runtime" }
ftui-render = { path = "../../../frankentui/crates/ftui-render" }
ftui-web = { path = "../../../frankentui/crates/ftui-web", features = ["input-parser"] }
ftui-widgets = { path = "../../../frankentui/crates/ftui-widgets", features = ["debug-overlay", "regex-search"] }
ftui-extras = { path = "../../../frankentui/crates/ftui-extras", features = [
  "canvas",
  "charts",
  "markdown",
  "text-effects",
  "theme",
  "visual-fx",
] }
chrono = { version = "0.4", features = ["serde"] }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlmodel-sqlite = { version = "=0.3.2", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
same-file = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[[bin]]
name = "am-export-dashboard-demo"
path = "src/bin/export_demo_pack.rs"
required-features = ["exporter"]

[lints]
rust.unsafe_code = "forbid"

[workspace]
resolver = "3"
