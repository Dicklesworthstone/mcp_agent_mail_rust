[workspace]
resolver = "2"
members = [
  "crates/mcp-agent-mail",
  "crates/mcp-agent-mail-core",
  "crates/mcp-agent-mail-db",
  "crates/mcp-agent-mail-storage",
  "crates/mcp-agent-mail-server",
  "crates/mcp-agent-mail-tools",
  "crates/mcp-agent-mail-cli",
  "crates/mcp-agent-mail-guard",
  "crates/mcp-agent-mail-share",
  "crates/mcp-agent-mail-conformance",
  "crates/mcp-agent-mail-search-core",
  "crates/mcp-agent-mail-test-helpers",
]
exclude = ["experimental/*", "crates/mcp-agent-mail-dashboard-wasm"]

[workspace.package]
version = "0.3.26"
edition = "2024"
license = "LicenseRef-MIT-Rider"
license-file = "LICENSE"
rust-version = "1.95"
repository = "https://github.com/Dicklesworthstone/mcp_agent_mail_rust"
authors = ["Jeff Emanuel"]

[workspace.dependencies]
# Required internal dependencies (local projects)
fastmcp = { version = "0.3.1", package = "fastmcp-rust" }
fastmcp-core = "0.3.1"
fastmcp-server = "0.3.1"
fastmcp-transport = "0.3.1"
fastmcp-protocol = "0.3.1"

# br-ba1ui: exact pins keep the shared Asupersync type universe coherent.
# SQLModel 0.3.2 and sqlmodel-sqlite 0.3.3 are published with an exact
# Asupersync 0.3.10 dependency, so these SQLModel pins resolve directly
# from crates.io without a sibling-checkout patch.
asupersync = { version = "=0.4.4", features = ["tls-webpki-roots"] }

sqlmodel = "=0.4.0"
sqlmodel-core = "=0.4.0"
sqlmodel-query = "=0.4.0"
sqlmodel-schema = "=0.4.0"
sqlmodel-session = "=0.4.0"
sqlmodel-pool = "=0.4.0"
sqlmodel-frankensqlite = "=0.4.0"
sqlmodel-sqlite = "=0.4.0"

ftui = "0.5.0"
ftui-runtime = { version = "0.5.0" }
ftui-extras = { version = "0.5.0", features = ["theme", "syntax", "export", "markdown", "charts", "text-effects", "diagram", "forms", "clipboard", "image", "visual-fx"] }
ftui-widgets = { version = "0.5.0", features = ["debug-overlay", "regex-search"] }
ftui-tty = "0.5.0"
ftui-harness = "0.5.0"
ftui-render = "0.5.0"
beads_rust = { version = "0.3.0", default-features = false }
toon = { version = "0.2.3", package = "tru" }
# GH#161: global allocator for the long-running serve-http daemon to avoid
# glibc per-thread arena fragmentation (multi-GB retained RSS under load).
mimalloc = "0.1"

# Internal workspace crates
mcp-agent-mail-core = { path = "crates/mcp-agent-mail-core" }
mcp-agent-mail-db = { path = "crates/mcp-agent-mail-db", default-features = false }
mcp-agent-mail-storage = { path = "crates/mcp-agent-mail-storage", default-features = false }
mcp-agent-mail-server = { path = "crates/mcp-agent-mail-server", default-features = false }
mcp-agent-mail-tools = { path = "crates/mcp-agent-mail-tools", default-features = false }
mcp-agent-mail-cli = { path = "crates/mcp-agent-mail-cli", default-features = false }
mcp-agent-mail-guard = { path = "crates/mcp-agent-mail-guard" }
mcp-agent-mail-share = { path = "crates/mcp-agent-mail-share", default-features = false }
mcp-agent-mail-conformance = { path = "crates/mcp-agent-mail-conformance" }
mcp-agent-mail-search-core = { path = "crates/mcp-agent-mail-search-core" }
mcp-agent-mail-test-helpers = { path = "crates/mcp-agent-mail-test-helpers" }

# Core ecosystem deps
franken-agent-detection = "0.1.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1.2"
toml_edit = "0.25"
json5 = "1.3.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
web-time = "1.1.0"
comrak = { version = "0.54.0", default-features = false }
include_dir = "0.7.4"
minijinja = "2.15.1"
ammonia = "4.1.2"
regex = "1"
unicode-normalization = "0.1"
same-file = "1"
similar = "3.1.1"
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }
glob = "0.3.3"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4"
base64 = "0.23"
ed25519-dalek = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
criterion = { version = "0.8", features = ["html_reports"] }
loom = "0.7"
proptest = "1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
fs2 = "0.4"
walkdir = "2"
tantivy = "0.26.1"
indexmap = "2"
nix = "0.31.3"
signal-hook = "0.4.4"

# frankensearch: two-tier hybrid search engine + optional cross-encoder rerank.
#
# Do not enable frankensearch's aggregate `hybrid`/`semantic` features here:
# those currently include FastEmbed, which pulls hf-hub/reqwest/hyper/tokio.
# Downstream crates opt into the exact no-Tokio subfeatures they need.
frankensearch = { version = "0.3.2", path = "../frankensearch/frankensearch", default-features = false, features = ["lexical-tantivy"] }
frankensearch-core = { version = "0.2.1", path = "../frankensearch/crates/frankensearch-core" }
frankensearch-embed = { version = "0.2.1", path = "../frankensearch/crates/frankensearch-embed", default-features = false }
frankensearch-index = { version = "0.2.1", path = "../frankensearch/crates/frankensearch-index" }
frankensearch-fusion = { version = "0.2.1", path = "../frankensearch/crates/frankensearch-fusion" }

# Two-tier search dependencies (legacy, being replaced by frankensearch)
half = "2"
wide = "1.5.0"
safetensors = "0.8"
tokenizers = "0.23.1"
rayon = "1"
dirs = "6"
smallvec = { version = "1", features = ["serde"] }

# WASM dependencies
serde-wasm-bindgen = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow early development lints
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# ── Build profiles ──────────────────────────────────────────────────────────

[profile.dev]
opt-level = 1            # Slight optimization for faster test execution
debug = 2                # Full debug info for development

[profile.release]
lto = "thin"             # Cross-crate optimization (80% of full LTO, much faster compile)
codegen-units = 1        # Single codegen unit for maximum optimization
panic = "unwind"         # Keep long-running server workers from aborting the process on panics
opt-level = 3            # Maximum optimization for speed
strip = "symbols"        # Remove debug symbols from production binary

[profile.bench]
inherits = "release"     # Benchmarks use same optimizations as release

[patch.crates-io]
# Keep asupersync unified with the sibling checkouts. FrankenSearch
# references asupersync via the absolute `/dp/asupersync`
# path (fleet-wide symlink to the canonical checkout); we MUST use the
# identical path string here or cargo treats `../asupersync` and
# `/dp/asupersync` as two distinct packages and refuses the lock
# ("package collision in the lockfile"). Single path string => single
# Cx/Outcome universe.
#
# br-noizk NOTE (2026-08-10): the /dp checkout is now 0.4.3, which no longer
# matches this workspace's =0.3.10 universe (sqlmodel 0.3.2/0.3.3 on
# crates.io pin asupersync =0.3.10 exactly; frankensearch caps <0.4). The
# patch is therefore INERT — cargo records it under [[patch.unused]] and the
# whole graph resolves one asupersync 0.3.10 from the registry, so the
# single-universe invariant still holds. Keep the line (same path string)
# so the patch re-engages automatically when the fleet unifies on 0.4.x
# (needs: sqlmodel release accepting 0.4, frankensearch ceiling lift,
# fastmcp bump — inventory on bead br-noizk).
asupersync = { path = "/dp/asupersync" }
# br-vlsf2 (2026-08-12): workspace harmonized to the asupersync 0.4.3 line.
# sqlmodel 0.4.0 accepting asupersync =0.4.3 is not on crates.io yet, so the
# family is path-patched to the sibling checkout (branch harmonize/vlsf2-fsqlite03,
# off release/fsqlite-0.2.1 with fsqlite reqs flipped 0.2->0.3). Cleanup trigger:
# a sqlmodel 0.4.x lockstep release on crates.io accepting asupersync 0.4.3 and
# fsqlite 0.3 — then delete these eight lines and resolve from the registry.
sqlmodel = { path = "/dp/sqlmodel_rust/crates/sqlmodel" }
sqlmodel-core = { path = "/dp/sqlmodel_rust/crates/sqlmodel-core" }
sqlmodel-query = { path = "/dp/sqlmodel_rust/crates/sqlmodel-query" }
sqlmodel-schema = { path = "/dp/sqlmodel_rust/crates/sqlmodel-schema" }
sqlmodel-session = { path = "/dp/sqlmodel_rust/crates/sqlmodel-session" }
sqlmodel-pool = { path = "/dp/sqlmodel_rust/crates/sqlmodel-pool" }
sqlmodel-frankensqlite = { path = "/dp/sqlmodel_rust/crates/sqlmodel-frankensqlite" }
sqlmodel-sqlite = { path = "/dp/sqlmodel_rust/crates/sqlmodel-sqlite" }
#
# fastmcp-rust is temporarily force-patched to the sibling checkout
# until its own v0.3 release propagates to crates.io. The currently
# published fastmcp 0.2.1 on crates.io still depends on asupersync
# 0.2.9, which would bifurcate the asupersync graph against our own
# 0.3.x direct dep (producing hundreds of "multiple different versions
# of crate `asupersync`" Cx/Outcome type mismatches).
#
# The [workspace.dependencies] entries above are already set to compatible
# 0.3.x versions, so the only cleanup step once fastmcp 0.3 lands on
# crates.io is to delete this block (plus the five fastmcp-* lines
# below). cargo will then resolve all five from the registry.
fastmcp-rust = { path = "../fastmcp_rust/crates/fastmcp" }
fastmcp-core = { path = "../fastmcp_rust/crates/fastmcp-core" }
fastmcp-server = { path = "../fastmcp_rust/crates/fastmcp-server" }
fastmcp-transport = { path = "../fastmcp_rust/crates/fastmcp-transport" }
fastmcp-protocol = { path = "../fastmcp_rust/crates/fastmcp-protocol" }

beads_rust = { path = "../beads_rust" }
franken-agent-detection = { path = "../franken_agent_detection" }
# ftui patches keep the repo on the latest local /dp frankentui APIs.
ftui = { path = "../frankentui/crates/ftui" }
ftui-core = { path = "../frankentui/crates/ftui-core" }
ftui-runtime = { path = "../frankentui/crates/ftui-runtime" }
ftui-extras = { path = "../frankentui/crates/ftui-extras" }
ftui-widgets = { path = "../frankentui/crates/ftui-widgets" }
ftui-tty = { path = "../frankentui/crates/ftui-tty" }
ftui-harness = { path = "../frankentui/crates/ftui-harness" }
ftui-render = { path = "../frankentui/crates/ftui-render" }
ftui-layout = { path = "../frankentui/crates/ftui-layout" }
ftui-style = { path = "../frankentui/crates/ftui-style" }
ftui-text = { path = "../frankentui/crates/ftui-text" }
ftui-backend = { path = "../frankentui/crates/ftui-backend" }
# FrankenSQLite git-rev pin — see the rationale block above the
# dependency notes. Every fsqlite crate in the graph is patched to ONE
# rev so beads_rust and sqlmodel-frankensqlite share a single engine.
#
# UNPARKED 2026-08-11 (bead br-noizk): the asupersync deadlock that made
# re-resolution impossible is fixed — the whole graph now resolves ONE
# registry asupersync 0.3.10 (fastmcp sibling bumped =0.3.9 -> =0.3.10;
# the /dp/asupersync 0.4.3 path patch is inert under [[patch.unused]]).
# The fsqlite rev below requires asupersync ^0.3.9, so the pin is only
# resolvable on the 0.3.x line — do NOT move the workspace to
# asupersync 0.4.x while this pin is active.
fsqlite = { path = "/dp/frankensqlite/crates/fsqlite" }
fsqlite-ast = { path = "/dp/frankensqlite/crates/fsqlite-ast" }
fsqlite-btree = { path = "/dp/frankensqlite/crates/fsqlite-btree" }
fsqlite-core = { path = "/dp/frankensqlite/crates/fsqlite-core" }
fsqlite-error = { path = "/dp/frankensqlite/crates/fsqlite-error" }
fsqlite-ext-fts5 = { path = "/dp/frankensqlite/crates/fsqlite-ext-fts5" }
fsqlite-ext-icu = { path = "/dp/frankensqlite/crates/fsqlite-ext-icu" }
fsqlite-ext-json = { path = "/dp/frankensqlite/crates/fsqlite-ext-json" }
fsqlite-ext-misc = { path = "/dp/frankensqlite/crates/fsqlite-ext-misc" }
fsqlite-ext-rtree = { path = "/dp/frankensqlite/crates/fsqlite-ext-rtree" }
fsqlite-func = { path = "/dp/frankensqlite/crates/fsqlite-func" }
fsqlite-mvcc = { path = "/dp/frankensqlite/crates/fsqlite-mvcc" }
fsqlite-observability = { path = "/dp/frankensqlite/crates/fsqlite-observability" }
fsqlite-pager = { path = "/dp/frankensqlite/crates/fsqlite-pager" }
fsqlite-parser = { path = "/dp/frankensqlite/crates/fsqlite-parser" }
fsqlite-planner = { path = "/dp/frankensqlite/crates/fsqlite-planner" }
fsqlite-types = { path = "/dp/frankensqlite/crates/fsqlite-types" }
fsqlite-vdbe = { path = "/dp/frankensqlite/crates/fsqlite-vdbe" }
fsqlite-vfs = { path = "/dp/frankensqlite/crates/fsqlite-vfs" }
fsqlite-wal = { path = "/dp/frankensqlite/crates/fsqlite-wal" }
ftui-i18n = { path = "../frankentui/crates/ftui-i18n" }
tru = { path = "../toon_rust" }
rich_rust = { path = "../rich_rust" }

# FrankenSQLite: git-rev pinned via [patch.crates-io] (decision 2026-08-10,
# bead br-hpv61 / fleet stall investigation; supersedes the earlier
# "intentionally NOT path-patched" ruling whose re-evaluation trigger fired).
#
# Why: the crates.io 0.1.x line lacks the 2026-07-21 durability wave
# (NamespaceOpenIntent::ReadOnlyExisting + ns-lifecycle) that br-29u5s and
# br-mmnyj need, and that wave is implicated in the fleet-wide tool-call
# stalls (write p99 17-24s on this very mailbox; see br-hpv61). fsqlite
# 0.2.0 IS on crates.io (2026-08-03) and contains the wave, but
# sqlmodel-frankensqlite <= 0.3.2 requires ^0.1.18, so the registry route
# is closed until a sqlmodel release accepts 0.2.x — and 0.2.0 also lacks
# the GH#294 open-must-not-mutate fixes (2026-08-09/10, unreleased).
#
# The pin below is rev 2351c6c5 — the SAME rev cass
# (coding_agent_session_search) pins and builds against: the tip of the
# 0.1.19-semver fts5 line, verified to contain the ReadOnlyExisting wave
# (ancestor 6a86c071) plus the deferred-FTS5-validation open. Being
# 0.1.19-semver, it satisfies sqlmodel and beads_rust requirements.
#
# Rollback: delete the fsqlite* entries from [patch.crates-io] below.
# Cleanup trigger: a sqlmodel-frankensqlite release accepting fsqlite
# 0.2.x AND an fsqlite release containing GH#294 — then drop the patches
# and resolve from the registry again.
#
# 2026-08-11 trigger progress: the fsqlite half is SATISFIED — fsqlite
# 0.2.1 is on crates.io (ns-lifecycle wave + full FTS5 line + GH#294
# mutation-free opens). Still waiting on (1) the sqlmodel-* lockstep
# release accepting fsqlite ^0.2 (migration merged on sqlmodel main at
# d9a3355 / bd-mk6o; crates.io max is still 0.3.2 requiring ^0.1.19,
# publish staged upstream awaiting go) and (2) beads_rust lifting its
# fsqlite ^0.1.18 requirement so the workspace keeps ONE engine.
# Tracking bead: see the fsqlite-0.2.1 registry adoption bead.

# --- rch OOM mitigation (2026-07-23) ---------------------------------------
# The 31k-line mcp-agent-mail-server crate needs ~7-10GB/rustc and OOM-kills the
# 15-29GB rch workers, so rch fails the remote build and falls back to a LOCAL
# compile on the trj orchestrator (load spikes + /data/tmp ENOSPC). These per-
# package overrides cut per-rustc peak memory so it builds on the small workers
# instead of flooding trj. Revert = delete this block.
[profile.release.package."mcp-agent-mail-server"]
codegen-units = 16

[profile.dev.package."mcp-agent-mail-server"]
debug = 1
