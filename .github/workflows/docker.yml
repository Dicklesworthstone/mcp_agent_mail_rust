# Publish a multi-arch container image to ghcr.io.
#
# Triggers
# --------
#   push tag v*          — canonical release path. Waits for dist.yml to
#                          publish the matching GitHub Release, verifies its
#                          Linux binaries, and packages them with
#                          the Bake release target. Publishes :<tag>, :latest, and
#                          the SemVer aliases.
#   workflow_dispatch    — non-release source build. Accepts inputs.am_ref and
#                          inputs.sibling_ref and publishes only source-*
#                          tags, which cannot overwrite release tags.
#
# The tag path never recompiles the project. The binaries in the container are
# the checksum-verified bytes from the public GitHub Release for that exact
# tag. Dockerfile remains available only to workflow_dispatch for explicitly
# non-release source builds.
name: docker
# Fork canary builds use workflow_dispatch with a pinned upstream release tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      am_ref:
        description: 'Git ref of mcp_agent_mail_rust to build (tag, branch, or full 40-char SHA — short SHAs are not accepted by GitHub upload-pack).'
        required: false
        default: 'main'
      sibling_ref:
        description: 'Git ref for sibling deps (frankensearch, asupersync, ...) — tag, branch, or full 40-char SHA only.'
        required: false
        default: 'main'
      tag_suffix:
        description: 'Source-build tag component; always namespaced and suffixed with the resolved AM_REF commit SHA.'
        required: false
        default: 'manual'

# Cancel an in-progress workflow only for non-tag refs. We never want to
# cancel a release build mid-flight because that could leave the image
# registry inconsistent with the GitHub Release artifacts.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Minimal default permissions; jobs request what they need.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Image path is forced lowercase because the GitHub repository slug
  # contains a mixed-case owner ("Dicklesworthstone") but OCI registries
  # require lowercase image names.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Bind release inputs and image metadata
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      image: ${{ steps.image.outputs.image }}
      mode: ${{ steps.refs.outputs.mode }}
      dockerfile: ${{ steps.refs.outputs.dockerfile }}
      version: ${{ steps.refs.outputs.version }}
      revision: ${{ steps.refs.outputs.revision }}
      release_tag: ${{ steps.refs.outputs.release_tag }}
      am_ref: ${{ steps.refs.outputs.am_ref }}
      sibling_ref: ${{ steps.refs.outputs.sibling_ref }}
      sibling_fallback_ref: ${{ steps.refs.outputs.sibling_fallback_ref }}
      tag_suffix: ${{ steps.refs.outputs.tag_suffix }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    permissions:
      contents: read

    steps:
      - name: Checkout triggering source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Lowercase image name
        id: image
        env:
          RAW_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          lowered="${RAW_IMAGE,,}"
          printf 'image=%s\n' "$lowered" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify build contract
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          INPUT_AM_REF: ${{ inputs.am_ref }}
          INPUT_SIBLING_REF: ${{ inputs.sibling_ref }}
          INPUT_TAG_SUFFIX: ${{ inputs.tag_suffix }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            release_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
            if [ "$GITHUB_REF_VALUE" != "refs/tags/${REF_NAME}" ] || [[ ! "$REF_NAME" =~ $release_tag_pattern ]]; then
              echo "Release containers require an exact vX.Y.Z or vX.Y.Z-prerelease tag" >&2
              exit 1
            fi

            mode="release"
            dockerfile="./Dockerfile.release"
            release_tag="$REF_NAME"
            version="${REF_NAME#v}"
            revision="$(git rev-parse HEAD)"
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Checked-out release revision is not a full commit SHA: ${revision}" >&2
              exit 1
            fi

            # Bind the checked-out commit to the tag as it exists on origin.
            # Annotated tags have a peeled ^{} ref; lightweight tags do not.
            remote_revision="$(git ls-remote origin "refs/tags/${REF_NAME}^{}" | awk 'NR == 1 {print $1}')"
            if [ -z "$remote_revision" ]; then
              remote_revision="$(git ls-remote origin "refs/tags/${REF_NAME}" | awk 'NR == 1 {print $1}')"
            fi
            if [ "$remote_revision" != "$revision" ]; then
              echo "Tag ${REF_NAME} resolves to ${remote_revision:-missing}, not checked-out ${revision}" >&2
              exit 1
            fi

            manifest_version="$(python3 - <<'PY'
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          print(manifest["workspace"]["package"]["version"])
          PY
            )"
            if [ "$manifest_version" != "$version" ]; then
              echo "Tag version ${version} does not match workspace version ${manifest_version}" >&2
              exit 1
            fi

            # The release lane consumes published binaries; these source-build
            # refs are intentionally inert in Dockerfile.release.
            am_ref="$revision"
            sibling_ref="$revision"
            tag_suffix=""
          else
            mode="source"
            dockerfile="./Dockerfile"
            release_tag=""
            version="manual"
            requested_am_ref="${INPUT_AM_REF:-main}"
            sibling_ref="${INPUT_SIBLING_REF:-main}"
            tag_suffix="${INPUT_TAG_SUFFIX:-manual}"
            for input_ref in "$requested_am_ref" "$sibling_ref" "$tag_suffix"; do
              if [[ "$input_ref" == *$'\n'* || "$input_ref" == *$'\r'* ]]; then
                echo "Manual source inputs must be single-line values" >&2
                exit 1
              fi
            done
            if [[ ! "$tag_suffix" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
              echo "Manual tag suffix must be 1-64 lowercase tag-safe characters" >&2
              exit 1
            fi

            # Resolve the user-facing branch/tag once, then pass only the
            # immutable commit to Docker. A hexadecimal value shorter than a
            # full object ID is deliberately not reinterpreted as a branch.
            if [[ "$requested_am_ref" =~ ^[0-9a-f]{40}$ ]]; then
              fetch_ref="$requested_am_ref"
              expected_revision="$requested_am_ref"
            elif [[ "$requested_am_ref" =~ ^[0-9A-Fa-f]{1,40}$ ]]; then
              echo "Manual AM_REF must not be a short or non-canonical commit SHA" >&2
              exit 1
            else
              git check-ref-format "refs/heads/${requested_am_ref}" >/dev/null || {
                echo "Manual AM_REF is not a valid branch or tag name" >&2
                exit 1
              }
              remote_refs="$(git ls-remote --heads --tags origin)"
              head_revision="$(awk -v target="refs/heads/${requested_am_ref}" '$2 == target {print $1}' <<< "$remote_refs")"
              tag_revision="$(awk -v target="refs/tags/${requested_am_ref}" '$2 == target {print $1}' <<< "$remote_refs")"
              peeled_revision="$(awk -v target="refs/tags/${requested_am_ref}^{}" '$2 == target {print $1}' <<< "$remote_refs")"

              if [ -n "$head_revision" ] && [ -n "$tag_revision" ]; then
                echo "Manual AM_REF is ambiguous: both a branch and tag use that name" >&2
                exit 1
              elif [ -n "$head_revision" ]; then
                fetch_ref="refs/heads/${requested_am_ref}"
                expected_revision="$head_revision"
              elif [ -n "$tag_revision" ]; then
                fetch_ref="refs/tags/${requested_am_ref}"
                expected_revision="${peeled_revision:-$tag_revision}"
              else
                echo "Manual AM_REF does not name a remote branch, tag, or full commit" >&2
                exit 1
              fi
            fi

            git fetch --no-tags --depth=1 origin "$fetch_ref"
            revision="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]] || [ "$revision" != "$expected_revision" ]; then
              echo "Fetched AM_REF resolved to ${revision:-missing}, expected ${expected_revision}" >&2
              exit 1
            fi

            # Dockerfile's full-SHA lane fetches this exact object and checks
            # out FETCH_HEAD. Never pass the original moving ref to the build.
            am_ref="$revision"
          fi
          {
            printf 'mode=%s\n' "$mode"
            printf 'dockerfile=%s\n' "$dockerfile"
            printf 'version=%s\n' "$version"
            printf 'revision=%s\n' "$revision"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'am_ref=%s\n' "$am_ref"
            printf 'sibling_ref=%s\n' "$sibling_ref"
            printf 'sibling_fallback_ref=%s\n' "main"
            printf 'tag_suffix=%s\n' "$tag_suffix"
          } >> "$GITHUB_OUTPUT"
          {
            printf '### Container build contract\n\n'
            printf -- '- Mode: `%s`\n' "$mode"
            printf -- '- Source revision: `%s`\n' "$revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify published release binaries
        if: ${{ steps.refs.outputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.refs.outputs.release_tag }}
        run: |
          set -euo pipefail

          amd64_archive="mcp-agent-mail-x86_64-unknown-linux-gnu.tar.xz"
          arm64_archive="mcp-agent-mail-aarch64-unknown-linux-gnu.tar.xz"
          required_assets=(
            "$amd64_archive"
            "${amd64_archive}.sha256"
            "$arm64_archive"
            "${arm64_archive}.sha256"
            "SHA256SUMS"
          )

          release_ready() {
            local json="$1"
            local asset count state size digest

            [ "$(jq -r '.tag_name // empty' <<< "$json")" = "$RELEASE_TAG" ] || return 1
            [ "$(jq -r '.draft // true' <<< "$json")" = "false" ] || return 1
            for asset in "${required_assets[@]}"; do
              count="$(jq -r --arg name "$asset" '[.assets[] | select(.name == $name)] | length' <<< "$json")"
              [ "$count" = "1" ] || return 1
              state="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .state' <<< "$json")"
              size="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .size' <<< "$json")"
              digest="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest // empty' <<< "$json")"
              [ "$state" = "uploaded" ] || return 1
              [ "$size" -gt 0 ] || return 1
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            done
          }

          release_json=""
          for attempt in $(seq 1 180); do
            if release_json="$(gh api -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" 2>/dev/null)" \
                && release_ready "$release_json"; then
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "Timed out waiting for the verified public ${RELEASE_TAG} release bundle" >&2
              exit 1
            fi
            printf 'Release assets not complete yet (attempt %s/180); retrying in 30s\n' "$attempt"
            sleep 30
          done

          asset_fingerprint() {
            local json="$1"
            local asset
            for asset in "${required_assets[@]}"; do
              jq -r --arg name "$asset" \
                '.assets[] | select(.name == $name) | [.id, .name, .size, .digest, .state] | @tsv' \
                <<< "$json"
            done
          }
          before_fingerprint="$(asset_fingerprint "$release_json")"

          mkdir -p release-assets dist/amd64 dist/arm64
          download_args=()
          for asset in "${required_assets[@]}"; do
            download_args+=(--pattern "$asset")
          done
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --dir release-assets "${download_args[@]}"

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [ "$asset_count" -ne "${#required_assets[@]}" ]; then
            echo "Expected ${#required_assets[@]} downloaded release assets, found ${asset_count}" >&2
            exit 1
          fi

          after_json="$(gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GH_REPO}/releases/tags/${RELEASE_TAG}")"
          release_ready "$after_json" || {
            echo "Release asset set became incomplete during download" >&2
            exit 1
          }
          after_fingerprint="$(asset_fingerprint "$after_json")"
          if [ "$before_fingerprint" != "$after_fingerprint" ]; then
            echo "Release asset identity changed during download" >&2
            exit 1
          fi

          # GitHub's asset digest, the per-archive sidecar, and the consolidated
          # SHA256SUMS must all agree with the downloaded bytes.
          for asset in "${required_assets[@]}"; do
            actual_api_digest="sha256:$(sha256sum "release-assets/${asset}" | awk '{print $1}')"
            expected_api_digest="$(jq -r --arg name "$asset" \
              '.assets[] | select(.name == $name) | .digest' <<< "$after_json")"
            if [ "$actual_api_digest" != "$expected_api_digest" ]; then
              echo "GitHub asset digest mismatch for ${asset}" >&2
              exit 1
            fi
          done

          for archive in "$amd64_archive" "$arm64_archive"; do
            actual_hash="$(sha256sum "release-assets/${archive}" | awk '{print $1}')"
            sidecar_hash="$(awk 'NR == 1 {print $1}' "release-assets/${archive}.sha256")"
            sidecar_name="$(awk 'NR == 1 {print $2}' "release-assets/${archive}.sha256")"
            sidecar_name="${sidecar_name#\*}"
            mapfile -t sums_hashes < <(
              awk -v artifact="$archive" \
                '$2 == artifact || $2 == ("./" artifact) || $2 == ("*" artifact) {print $1}' \
                release-assets/SHA256SUMS
            )
            if [ "$sidecar_name" != "$archive" ] || [ "${#sums_hashes[@]}" -ne 1 ] \
                || [ "$actual_hash" != "$sidecar_hash" ] \
                || [ "$actual_hash" != "${sums_hashes[0]:-}" ]; then
              echo "Published checksum witnesses disagree for ${archive}" >&2
              exit 1
            fi
          done

          extract_release_archive() {
            local archive="$1"
            local destination="$2"
            local members verbose_members

            mapfile -t members < <(tar -tJf "release-assets/${archive}" | sed 's#^\./##' | sort)
            mapfile -t verbose_members < <(tar -tvJf "release-assets/${archive}")
            if [ "${members[*]}" != "am mcp-agent-mail" ] || [ "${#verbose_members[@]}" -ne 2 ]; then
              echo "${archive} must contain exactly the two flat release binaries" >&2
              exit 1
            fi
            for member_line in "${verbose_members[@]}"; do
              if [ "${member_line:0:1}" != "-" ]; then
                echo "${archive} contains a non-regular entry" >&2
                exit 1
              fi
            done
            tar --extract --xz --file="release-assets/${archive}" \
              --directory="$destination" --no-same-owner --no-same-permissions
            for binary in am mcp-agent-mail; do
              if [ ! -f "${destination}/${binary}" ] || [ -L "${destination}/${binary}" ]; then
                echo "${archive} did not extract a regular ${binary} binary" >&2
                exit 1
              fi
            done
          }

          extract_release_archive "$amd64_archive" dist/amd64
          extract_release_archive "$arm64_archive" dist/arm64

      - name: Upload verified release-binary context
        if: ${{ steps.refs.outputs.mode == 'release' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-binaries-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ steps.image.outputs.image }}
          # Tag strategy:
          #   stable tag (vX.Y.Z) → :v0.3.6, :0.3.6, :0.3, :latest
          #   pre-release (vX.Y.Z-rc1, -beta, ...) → :v0.3.6-rc1, :0.3.6-rc1
          #     (NO :latest, NO :{major.minor} — those should only ever point
          #      at stable releases to avoid surprising `:latest` consumers.)
          #   manual source run → :source-<suffix>-<full-sha>,
          #                       :source-sha-<full-sha>
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=source-${{ steps.refs.outputs.tag_suffix }}-${{ steps.refs.outputs.revision }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=source-sha-${{ steps.refs.outputs.revision }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.version=${{ steps.refs.outputs.version }}
            org.opencontainers.image.revision=${{ steps.refs.outputs.revision }}

      - name: Validate publication tag policy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          MODE: ${{ steps.refs.outputs.mode }}
          RELEASE_TAG: ${{ steps.refs.outputs.release_tag }}
          VERSION: ${{ steps.refs.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_REVISION: ${{ steps.refs.outputs.revision }}
          TAG_SUFFIX: ${{ steps.refs.outputs.tag_suffix }}
        run: |
          set -euo pipefail
          mapfile -t published_tags < <(printf '%s\n' "$TAGS" | sed '/^$/d' | sort -u)
          if [ "${#published_tags[@]}" -eq 0 ]; then
            echo "metadata-action produced no image tags" >&2
            exit 1
          fi

          if [ "$MODE" = "release" ]; then
            expected_tags=("${IMAGE}:${VERSION}" "${IMAGE}:${RELEASE_TAG}")
            if [[ "$VERSION" != *-* ]]; then
              expected_tags+=("${IMAGE}:${VERSION%.*}" "${IMAGE}:latest")
            fi
            if [ "${#published_tags[@]}" -ne "${#expected_tags[@]}" ]; then
              echo "Release tag set has unexpected aliases" >&2
              printf 'Actual: %s\n' "${published_tags[@]}" >&2
              exit 1
            fi
            for expected_tag in "${expected_tags[@]}"; do
              printf '%s\n' "${published_tags[@]}" | grep -qxF "$expected_tag" || {
                echo "Missing required release image tag ${expected_tag}" >&2
                exit 1
              }
            done
          else
            [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
            expected_tags=(
              "${IMAGE}:source-${TAG_SUFFIX}-${SOURCE_REVISION}"
              "${IMAGE}:source-sha-${SOURCE_REVISION}"
            )
            mapfile -t expected_tags < <(printf '%s\n' "${expected_tags[@]}" | sort -u)
            if [ "${#published_tags[@]}" -ne "${#expected_tags[@]}" ]; then
              echo "Manual source tag set has an unexpected size" >&2
              printf 'Actual: %s\n' "${published_tags[@]}" >&2
              exit 1
            fi
            for expected_tag in "${expected_tags[@]}"; do
              printf '%s\n' "${published_tags[@]}" | grep -qxF "$expected_tag" || {
                echo "Missing source-commit-bound image tag ${expected_tag}" >&2
                exit 1
              }
            done
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache_scope: linux-amd64
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: linux-arm64
            artifact: linux-arm64

    steps:
      - name: Checkout (Dockerfile + workflow only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download verified release binaries
        if: ${{ needs.prepare.outputs.mode == 'release' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-binaries-${{ github.run_id }}
          path: dist

      - name: Assert canonical build path
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          DOCKERFILE: ${{ needs.prepare.outputs.dockerfile }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          AM_REF: ${{ needs.prepare.outputs.am_ref }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "release" ]; then
            [ "$DOCKERFILE" = "./Dockerfile.release" ]
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
            [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
            for arch in amd64 arm64; do
              test -s "dist/${arch}/mcp-agent-mail"
              test -s "dist/${arch}/am"
            done
          else
            [ "$DOCKERFILE" = "./Dockerfile" ]
            [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
            [ "$AM_REF" = "$REVISION" ]
            grep -Fq 'git fetch --depth 1 origin "${AM_REF}"' "$DOCKERFILE"
            grep -Fq 'git checkout -q FETCH_HEAD' "$DOCKERFILE"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image digest with Bake
        id: build
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          AM_REF: ${{ needs.prepare.outputs.am_ref }}
          SIBLING_REF: ${{ needs.prepare.outputs.sibling_ref }}
          SIBLING_FALLBACK_REF: ${{ needs.prepare.outputs.sibling_fallback_ref }}
          CACHE_SCOPE: docker-${{ github.workflow }}-${{ needs.prepare.outputs.mode }}-${{ matrix.cache_scope }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          target="$MODE"
          repository="${GITHUB_REPOSITORY,,}"
          metadata_file="${RUNNER_TEMP}/bake-metadata.json"
          output="type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true"
          docker buildx bake "$target" --metadata-file "$metadata_file" \
            --set "${target}.platform=${PLATFORM}" \
            --set "${target}.output=${output}" \
            --set "${target}.args.BUILDER_BASE=ghcr.io/${repository}-builder-base:main" \
            --set "${target}.args.RUNTIME_BASE=ghcr.io/${repository}-runtime-base:main" \
            --set "${target}.args.AM_VERSION=${VERSION}" \
            --set "${target}.args.AM_REVISION=${REVISION}" \
            --set "${target}.args.AM_REF=${AM_REF}" \
            --set "${target}.args.SIBLING_REF=${SIBLING_REF}" \
            --set "${target}.args.SIBLING_FALLBACK_REF=${SIBLING_FALLBACK_REF}" \
            --set "${target}.labels.org.opencontainers.image.version=${VERSION}" \
            --set "${target}.labels.org.opencontainers.image.revision=${REVISION}" \
            --set "${target}.cache-from=type=gha,scope=${CACHE_SCOPE}" \
            --set "${target}.cache-to=type=gha,mode=max,scope=${CACHE_SCOPE}" \
            --set "${target}.attest=type=provenance,mode=max" \
            --set "${target}.attest=type=sbom"
          mapfile -t digests < <(jq -r 'to_entries[] | .value["containerimage.digest"] // empty' "$metadata_file")
          digest="${digests[0]:-}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Bake did not return a valid image digest: ${digest:-missing}" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build returned an invalid ${PLATFORM_ARTIFACT} digest: ${DIGEST}" >&2
            exit 1
          fi
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/${PLATFORM_ARTIFACT}.digest"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*.digest
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push manifest list
        id: manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "metadata-action produced no image tags" >&2
            exit 1
          fi

          expected_digest_files=(linux-amd64.digest linux-arm64.digest)
          mapfile -t actual_digest_files < <(
            find "$DIGEST_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          )
          if [ "${actual_digest_files[*]}" != "${expected_digest_files[*]}" ]; then
            echo "Expected exactly amd64 and arm64 digest witnesses" >&2
            printf 'Found: %s\n' "${actual_digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${expected_digest_files[@]}"; do
            digest="$(<"${DIGEST_DIR}/${digest_file}")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid digest in ${digest_file}: ${digest}" >&2
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done

          metadata_file="${RUNNER_TEMP:?}/imagetools-metadata.json"
          docker buildx imagetools create --metadata-file "$metadata_file" "${tag_args[@]}" "${sources[@]}"
          first_tag="${tag_args[1]}"
          digest="$(jq -r '."containerimage.descriptor".digest // empty' "$metadata_file")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "imagetools did not return a valid index digest" >&2
            exit 1
          fi

          manifest_json="$(docker buildx imagetools inspect --raw "$IMAGE@$digest")"
          jq -e '
            (.mediaType == "application/vnd.oci.image.index.v1+json"
              or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
            and ([.manifests[].platform
                  | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
                  | (.os + "/" + .architecture)] | sort | unique
                 == ["linux/amd64", "linux/arm64"])
            and ([.manifests[].platform
                  | select(.os == "linux")
                  | (.os + "/" + .architecture)] | length == 2)
            and all(.manifests[].platform;
                    (.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
                    or (.os == "unknown" and .architecture == "unknown"))
          ' <<< "$manifest_json" >/dev/null || {
            echo "Published index does not contain exactly one runnable amd64 and arm64 manifest" >&2
            exit 1
          }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'first_tag=%s\n' "$first_tag" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: ${{ steps.manifest.outputs.digest != '' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3.0.0
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Print published image references
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          MODE: ${{ needs.prepare.outputs.mode }}
          SOURCE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          printf 'Published image: %s@%s\n' "$IMAGE" "$DIGEST"
          printf 'Mode: %s\nSource revision: %s\n' "$MODE" "$SOURCE_REVISION"
          printf 'Tags:\n%s\n' "$TAGS"
          {
            printf '### Published container\n\n'
            printf -- '- Digest: `%s@%s`\n' "$IMAGE" "$DIGEST"
            printf -- '- Mode: `%s`\n' "$MODE"
            printf -- '- Source revision: `%s`\n' "$SOURCE_REVISION"
            printf '\nTags:\n```text\n%s\n```\n' "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
