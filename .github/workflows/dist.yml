name: dist

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # Release sibling path dependencies are pinned so rerunning a tag resolves
  # the same source bytes even after their default branches advance.
  FRANKENSEARCH_COMMIT: 3bbfd8c664062f8304e7a790c51794671f9214dc
  FAST_CMAES_COMMIT: 3bf11b7601b54a08ffabb55821289ecb235a504d
  BEADS_RUST_COMMIT: b5dc5444270d82218e8de6bb4c6320731e0bdd00

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned sibling dependencies
        shell: bash
        run: |
          set -euo pipefail

          checkout_pinned() {
            local repo_url="$1"
            local destination="$2"
            local expected_commit="$3"
            local actual_commit

            git init --quiet "$destination"
            git -C "$destination" remote add origin "$repo_url"
            git -C "$destination" fetch --quiet --depth 1 origin "$expected_commit"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD
            actual_commit="$(git -C "$destination" rev-parse HEAD)"
            if [ "$actual_commit" != "$expected_commit" ]; then
              echo "Expected $destination at $expected_commit, found $actual_commit" >&2
              exit 1
            fi
          }

          checkout_pinned https://github.com/Dicklesworthstone/frankensearch ../frankensearch "$FRANKENSEARCH_COMMIT"
          # frankensearch's tools/optimize_params workspace member depends on
          # ../../../fast_cmaes — required for workspace-wide cargo metadata.
          checkout_pinned https://github.com/Dicklesworthstone/fast_cmaes ../fast_cmaes "$FAST_CMAES_COMMIT"
          # beads_rust 0.5.1 is not yet published, so the workspace patch
          # requires this pinned sibling checkout to remain on version 0.5.1.
          checkout_pinned https://github.com/Dicklesworthstone/beads_rust ../beads_rust "$BEADS_RUST_COMMIT"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned sibling dependencies
        shell: bash
        run: |
          set -euo pipefail

          checkout_pinned() {
            local repo_url="$1"
            local destination="$2"
            local expected_commit="$3"
            local actual_commit

            git init --quiet "$destination"
            git -C "$destination" remote add origin "$repo_url"
            git -C "$destination" fetch --quiet --depth 1 origin "$expected_commit"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD
            actual_commit="$(git -C "$destination" rev-parse HEAD)"
            if [ "$actual_commit" != "$expected_commit" ]; then
              echo "Expected $destination at $expected_commit, found $actual_commit" >&2
              exit 1
            fi
          }

          checkout_pinned https://github.com/Dicklesworthstone/frankensearch ../frankensearch "$FRANKENSEARCH_COMMIT"
          # frankensearch's tools/optimize_params workspace member depends on
          # ../../../fast_cmaes — required for workspace-wide cargo metadata.
          checkout_pinned https://github.com/Dicklesworthstone/fast_cmaes ../fast_cmaes "$FAST_CMAES_COMMIT"
          # beads_rust 0.5.1 is not yet published, so the workspace patch
          # requires this pinned sibling checkout to remain on version 0.5.1.
          checkout_pinned https://github.com/Dicklesworthstone/beads_rust ../beads_rust "$BEADS_RUST_COMMIT"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: dtolnay/rust-toolchain@nightly

      - name: Run tests
        run: cargo test --workspace

  build:
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Statically-linked musl build — runs on any x86_64 Linux regardless
          # of host glibc (Debian 12, Ubuntu 22.04, RHEL 9, Amazon Linux 2023,
          # Alpine, etc.). Keeps the gnu artifact for distros that prefer it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned sibling dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Windows MAX_PATH (260 chars) trips on frankensqlite's perf-fixture
          # paths; enable git's long-path support before creating sibling
          # checkouts. No-op on Unix runners (the setting is harmless).
          git config --global core.longpaths true
          checkout_pinned() {
            local repo_url="$1"
            local destination="$2"
            local expected_commit="$3"
            local actual_commit

            git init --quiet "$destination"
            git -C "$destination" remote add origin "$repo_url"
            git -C "$destination" fetch --quiet --depth 1 origin "$expected_commit"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD
            actual_commit="$(git -C "$destination" rev-parse HEAD)"
            if [ "$actual_commit" != "$expected_commit" ]; then
              echo "Expected $destination at $expected_commit, found $actual_commit" >&2
              exit 1
            fi
          }

          checkout_pinned https://github.com/Dicklesworthstone/frankensearch ../frankensearch "$FRANKENSEARCH_COMMIT"
          # frankensearch's tools/optimize_params workspace member depends on
          # ../../../fast_cmaes — required for workspace-wide cargo metadata.
          checkout_pinned https://github.com/Dicklesworthstone/fast_cmaes ../fast_cmaes "$FAST_CMAES_COMMIT"
          # beads_rust 0.5.1 is not yet published, so the workspace patch
          # requires this pinned sibling checkout to remain on version 0.5.1.
          checkout_pinned https://github.com/Dicklesworthstone/beads_rust ../beads_rust "$BEADS_RUST_COMMIT"

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install pinned Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        # --no-default-features --features portable: exclude hybrid/fastembed
        # (ONNX Runtime ships AVX2-only static libs → SIGILL on older x86 CPUs).
        # Portable keeps s3fifo + tantivy-engine; hybrid can still be enabled
        # by users who build from source with default features.
        env:
          # Statically link glibc-free musl builds so the binary runs on any
          # x86_64 Linux regardless of host libc. Leaves other targets alone.
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build --release --target ${{ matrix.target }} -p mcp-agent-mail -p mcp-agent-mail-cli --no-default-features --features portable

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist staging
          TARBALL="mcp-agent-mail-${{ matrix.target }}.tar.xz"
          # Copy raw binaries into a flat staging dir to guarantee no nested archives
          cp "target/${{ matrix.target }}/release/mcp-agent-mail" staging/
          cp "target/${{ matrix.target }}/release/am" staging/
          # Verify the files are ELF/Mach-O binaries, not archives
          for f in staging/mcp-agent-mail staging/am; do
            mime=$(file --brief --mime-type "$f")
            case "$mime" in
              application/x-executable|application/x-mach-binary|application/x-pie-executable|application/x-sharedlib) ;;
              *) echo "ERROR: $f has unexpected type '$mime' — refusing to package" >&2; exit 1 ;;
            esac
          done
          # Surface verification: fail fast if binaries are swapped/mispackaged.
          staging/am --help > staging/am.help.txt
          staging/mcp-agent-mail --help > staging/mcp-agent-mail.help.txt
          grep -qE '(^|[[:space:]])serve-http([[:space:]]|$)' staging/am.help.txt || {
            echo "ERROR: staging/am missing expected CLI command surface" >&2
            exit 1
          }
          grep -qE '^Usage: mcp-agent-mail ' staging/mcp-agent-mail.help.txt || {
            echo "ERROR: staging/mcp-agent-mail has unexpected usage header" >&2
            exit 1
          }
          grep -qE '(^|[[:space:]])serve([[:space:]]|$)' staging/mcp-agent-mail.help.txt || {
            echo "ERROR: staging/mcp-agent-mail missing expected server command surface" >&2
            exit 1
          }
          tar -cJf "dist/$TARBALL" -C staging mcp-agent-mail am
          cd dist
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipName = "mcp-agent-mail-${{ matrix.target }}.zip"
          $cliHelp = & "target/${{ matrix.target }}/release/am.exe" --help | Out-String
          if ($cliHelp -notmatch '(^|\s)serve-http(\s|$)') {
            throw "target/${{ matrix.target }}/release/am.exe missing expected CLI command surface"
          }
          $serverHelp = & "target/${{ matrix.target }}/release/mcp-agent-mail.exe" --help | Out-String
          if ($serverHelp -notmatch 'Usage:\s+mcp-agent-mail') {
            throw "target/${{ matrix.target }}/release/mcp-agent-mail.exe has unexpected usage header"
          }
          if ($serverHelp -notmatch '(^|\s)serve(\s|$)') {
            throw "target/${{ matrix.target }}/release/mcp-agent-mail.exe missing expected server command surface"
          }
          Compress-Archive -Path "target/${{ matrix.target }}/release/mcp-agent-mail.exe","target/${{ matrix.target }}/release/am.exe" -DestinationPath "dist/$zipName"
          cd dist
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding ASCII "$zipName.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -laR dist

      - name: Install cosign
        # SHA-pinned to the v4.0.0 commit so a tag re-push (malicious or
        # accidental) cannot substitute a compromised action into the
        # signing step — the entire sigstore integrity chain hinges on this
        # action's code being the one we audited.
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign release artifacts (sigstore bundle)
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          for f in mcp-agent-mail-*.tar.xz mcp-agent-mail-*.zip; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Generate consolidated SHA256SUMS
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          archives=(mcp-agent-mail-*.tar.xz mcp-agent-mail-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No release archives found in dist/" >&2
            exit 1
          fi
          shasum -a 256 "${archives[@]}" > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Validate release bundle completeness
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          expected_archives=(
            mcp-agent-mail-x86_64-unknown-linux-gnu.tar.xz
            mcp-agent-mail-x86_64-unknown-linux-musl.tar.xz
            mcp-agent-mail-aarch64-unknown-linux-gnu.tar.xz
            mcp-agent-mail-x86_64-apple-darwin.tar.xz
            mcp-agent-mail-aarch64-apple-darwin.tar.xz
            mcp-agent-mail-x86_64-pc-windows-msvc.zip
          )
          archives=(mcp-agent-mail-*.tar.xz mcp-agent-mail-*.zip)
          if [ "${#archives[@]}" -ne "${#expected_archives[@]}" ]; then
            echo "Expected ${#expected_archives[@]} release archives, found ${#archives[@]}" >&2
            printf 'Found: %s\n' "${archives[@]}" >&2
            exit 1
          fi
          test -s SHA256SUMS
          for artifact in "${expected_archives[@]}"; do
            test -s "$artifact"
            test -s "${artifact}.sha256"
            test -s "${artifact}.sigstore.json"
            sidecar_hash="$(awk '{print $1; exit}' "${artifact}.sha256")"
            sums_hash="$(awk -v artifact="$artifact" '$2 == artifact || $2 == ("./" artifact) || $2 == ("*" artifact) {print $1; exit}' SHA256SUMS)"
            if [ -z "$sums_hash" ]; then
              echo "SHA256SUMS missing entry for ${artifact}" >&2
              exit 1
            fi
            if [ "$sidecar_hash" != "$sums_hash" ]; then
              echo "Checksum mismatch between ${artifact}.sha256 and SHA256SUMS for ${artifact}" >&2
              exit 1
            fi
          done

      - name: Copy install scripts to dist
        run: |
          cp install.sh dist/ 2>/dev/null || echo "No install.sh found"
          cp install.ps1 dist/ 2>/dev/null || echo "No install.ps1 found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
