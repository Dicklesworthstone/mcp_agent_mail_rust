name: Issue 353 native qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue353-native.yml'
      - 'scripts/ci/qualify_issue353.py'
      - 'docs/evidence/gh353/2026-10-28_gh353_request_latency_candidate.patch'
      - 'docs/evidence/gh353/2026-10-28_gh353_request_latency_baseline.patch'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue353-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, existing repository pin
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned native compiler and checks
        timeout-minutes: 15
        run: |
          rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
          rustc +nightly-2026-08-31 -vV
          cargo +nightly-2026-08-31 -vV
      - name: Qualify exact passive candidate and baseline patches
        timeout-minutes: 155
        run: |
          python3 scripts/ci/qualify_issue353.py \
            --repo "$GITHUB_WORKSPACE" \
            --work-root "$RUNNER_TEMP/issue353-work" \
            --evidence "$RUNNER_TEMP/issue353-evidence"
      - name: Preserve every completed or failed gate
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue353-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue353-evidence/
          if-no-files-found: error
          retention-days: 14
