[package]
name = "mcp-agent-mail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core types, models, and configuration for MCP Agent Mail"
# Distributed as binary-only via dist.yml + curl|bash installer.
# Workspace depends on unpublished sibling path crates, so cargo publish is not viable.
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
toml.workspace = true
json5.workspace = true
thiserror.workspace = true
chrono.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
same-file.workspace = true
dirs = "6"
getrandom = "0.4.2"
shellexpand = "3"
shlex = "2"
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
globset.workspace = true
# `fs` feature provides `nix::sys::statvfs` for inode probes in `host_health`.
nix = { workspace = true, features = ["fs"] }
rustix.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
tempfile.workspace = true
winsafe.workspace = true

[features]
# Optional local filesystem probes for installed coding-agent CLIs.
agent-detect = ["franken-agent-detection"]
# Enable loom model-checking tests (run with `cargo test --features loom-tests`)
loom-tests = []

[dependencies.franken-agent-detection]
workspace = true
optional = true

[dev-dependencies]
criterion.workspace = true
loom.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "toon_bench"
harness = false

[lints]
workspace = true
