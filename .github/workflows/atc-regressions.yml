name: ATC regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atc-regressions.yml'
      - 'scripts/atc_dispatch_persistence.py'
      - 'crates/mcp-agent-mail-server/src/atc*.rs'
      - 'crates/mcp-agent-mail-server/src/lib.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atc-regressions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atc:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DATABASE_URL: sqlite:///tmp/atc-regressions.sqlite3
      STORAGE_ROOT: /tmp/atc-regressions-storage
      HTTP_PORT: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce old write amplification before patching
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 scripts/atc_dispatch_persistence.py check; then
            python3 scripts/atc_dispatch_persistence.py test --expect-failure
          fi
      - name: Apply exact-context source patch and run regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/atc_dispatch_persistence.py apply
          python3 scripts/atc_dispatch_persistence.py check
          python3 scripts/atc_dispatch_persistence.py test
          python3 scripts/atc_dispatch_persistence.py harness > /tmp/atc_dispatch_regressions.rs
          git diff -- crates/mcp-agent-mail-server/src/lib.rs > /tmp/atc_dispatch_persistence.patch
      - name: Format changed Rust source
        run: |
          rustfmt --edition 2024 --config skip_children=true crates/mcp-agent-mail-server/src/lib.rs
          python3 scripts/atc_dispatch_persistence.py check
          python3 scripts/atc_dispatch_persistence.py test
      - name: Compile server targets
        run: cargo check --locked -p mcp-agent-mail-server --all-targets
      - name: Run server ATC tests
        run: cargo test --locked -p mcp-agent-mail-server --lib atc -- --nocapture
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc-regression-evidence-${{ github.sha }}
          path: |
            /tmp/atc_dispatch_regressions.rs
            /tmp/atc_dispatch_persistence.patch
            crates/mcp-agent-mail-server/src/lib.rs
          retention-days: 3
          if-no-files-found: error
      - name: Commit validated source directly to main
        shell: bash
        run: |
          set -euo pipefail
          target=crates/mcp-agent-mail-server/src/lib.rs
          if git diff --quiet -- "$target"; then
            echo 'Source fix is already integrated.'
            exit 0
          fi
          changed=$(git diff --name-only)
          test "$changed" = "$target"
          # Do not overwrite or silently rebase a concurrently updated main.
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'fix(atc): persist experiences only for budgeted dispatches (GH258)'
          git push origin HEAD:main
