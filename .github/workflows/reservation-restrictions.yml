name: Reservation restriction regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reservation-restrictions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reservation-restrictions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reservations:
    if: github.repository == 'Dicklesworthstone/mcp_agent_mail_rust' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DATABASE_URL: sqlite:///tmp/reservation-regressions.sqlite3
      STORAGE_ROOT: /tmp/reservation-regressions-storage
      HTTP_PORT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install repository-pinned compiler and checks
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version
      - name: Apply only the reviewed patch to the exact reviewed source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:crates/mcp-agent-mail-cli/src/lib.rs)" = 70d12b828d18dd13c25cb2311b54a90ce652bb0e
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          sha = 'c1f538dc21ba4de4b8401d564c0a7a339e673250'
          url = f'https://api.github.com/repos/Dicklesworthstone/mcp_agent_mail_rust/git/blobs/{sha}'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          assert blob['encoding'] == 'base64'
          patch = base64.b64decode(blob['content'])
          actual = hashlib.sha1(b'blob ' + str(len(patch)).encode() + b'\0' + patch).hexdigest()
          assert actual == sha, (actual, sha)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'reservation-restrictions.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/reservation-restrictions.patch"
          git apply "$RUNNER_TEMP/reservation-restrictions.patch"
          rustfmt --edition 2024 --config skip_children=true crates/mcp-agent-mail-cli/src/lib.rs
          test "$(git diff --name-only)" = crates/mcp-agent-mail-cli/src/lib.rs
          git diff --check
          git diff --stat
      - name: Publish candidate source object without updating a branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          source = pathlib.Path('crates/mcp-agent-mail-cli/src/lib.rs').read_bytes()
          expected = hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest()
          request = urllib.request.Request(
              'https://api.github.com/repos/Dicklesworthstone/mcp_agent_mail_rust/git/blobs',
              data=json.dumps({'content': source.decode('utf-8'), 'encoding': 'utf-8'}).encode(),
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == expected, result
          print('CANDIDATE_SOURCE_SHA=' + expected, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Candidate CLI source blob (not yet committed): `' + expected + '`\n')
          PY
      - uses: Swatinem/rust-cache@v2
      - name: Run native CLI reservation regressions
        run: cargo test --locked -p mcp-agent-mail-cli --lib file_reservations -- --test-threads=1 --nocapture
      - name: Check production feature graph
        if: ${{ !cancelled() }}
        run: cargo check --locked -p mcp-agent-mail-cli --lib --bins
      - name: Check all CLI targets
        if: ${{ !cancelled() }}
        run: cargo check --locked -p mcp-agent-mail-cli --all-targets
      - name: Check CLI lints
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p mcp-agent-mail-cli --all-targets -- -D warnings
      - name: Check formatter
        if: ${{ !cancelled() }}
        run: rustfmt --check --edition 2024 --config skip_children=true crates/mcp-agent-mail-cli/src/lib.rs
      - name: Preserve exact tested diff
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git diff --binary -- crates/mcp-agent-mail-cli/src/lib.rs > "$RUNNER_TEMP/reservation-restrictions-tested.patch"
          git diff --check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reservation-restrictions-tested-patch
          path: ${{ runner.temp }}/reservation-restrictions-tested.patch
          if-no-files-found: error
