name: Supply Chain Audit

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain-audit:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Clone sibling dependencies
        run: |
          # 2026-08-22 registry universe: only frankensearch (path dep) and
          # beads_rust (path patch) are sibling checkouts; everything else
          # resolves from crates.io.
          git clone --depth 1 https://github.com/Dicklesworthstone/frankensearch ../frankensearch
          # frankensearch's tools/optimize_params workspace member depends on
          # ../../../fast_cmaes — required for workspace-wide cargo metadata.
          git clone --depth 1 https://github.com/Dicklesworthstone/fast_cmaes ../fast_cmaes
          git clone --depth 1 https://github.com/Dicklesworthstone/beads_rust ../beads_rust

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install supply-chain tooling
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-audit cargo-deny

      - name: Run cargo-audit baseline
        shell: bash
        run: |
          set -euo pipefail
          cargo audit

      - name: Enforce cargo-deny async/runtime policy
        shell: bash
        run: |
          set -euo pipefail
          cargo deny check bans -c deny.toml --hide-inclusion-graph
