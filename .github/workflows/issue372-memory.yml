name: Issue 372 connection memory investigation

on:
  push:
    branches: ['qualification/gh372-memory-*']
    paths:
      - '.github/workflows/issue372-memory.yml'
      - 'scripts/gh372-memory-probe/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue372-memory-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_OPT_LEVEL: '1'
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  CARGO_HTTP_USER_AGENT: 'mcp_agent_mail_rust-agent (+https://github.com/Dicklesworthstone/mcp_agent_mail_rust)'
  RUST_TEST_THREADS: '1'
  RUSTFLAGS: '-Zunstable-options --jobs-backend=1 --jobs-frontend=1'

jobs:
  probe:
    name: Native Linux baseline and candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the repository's pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          rustc -vV
          cargo -vV
          uname -a
          free -h
          df -h "$RUNNER_TEMP"
      - name: Restore isolated probe dependencies
        id: probe-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/gh372-target
          key: gh372-probe-v1-${{ runner.os }}-${{ hashFiles('scripts/gh372-memory-probe/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            gh372-probe-v1-${{ runner.os }}-${{ hashFiles('scripts/gh372-memory-probe/Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Limit compiler heap retention without changing probe allocators
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gh372-rustc-wrapper" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          export MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0,narenas:1
          export _RJEM_MALLOC_CONF="$MALLOC_CONF"
          exec "$@"
          WRAPPER
          chmod +x "$RUNNER_TEMP/gh372-rustc-wrapper"
          printf 'RUSTC_WRAPPER=%s\n' "$RUNNER_TEMP/gh372-rustc-wrapper" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/gh372-target" >> "$GITHUB_ENV"
      - name: Compare native memory and preservation behavior
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 -I scripts/gh372-memory-probe/run_ci.py \
            --repo "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/gh372-native" \
            --patch "$GITHUB_WORKSPACE/scripts/gh372-memory-probe/fsqlite-bootstrap-stack.patch" \
            --provenance "$GITHUB_WORKSPACE/scripts/gh372-memory-probe/fsqlite-bootstrap-stack-provenance.json"
      - name: Retain native evidence and executable identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gh372-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gh372-native/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Retain dependencies even when the candidate budget fails
        if: always() && steps.probe-cache.outcome == 'success' && steps.probe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/gh372-target
          key: ${{ steps.probe-cache.outputs.cache-primary-key }}
