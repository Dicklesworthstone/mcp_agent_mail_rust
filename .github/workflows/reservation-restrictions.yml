name: Reservation restriction regressions

# Disabled: this project does not build or gate through GitHub Actions (builds
# and release gates run locally via rch/dsr), and PR #331 is not merged. The
# push trigger is removed so no push to main runs this job; the same
# regressions run locally with:
#   cargo test -p mcp-agent-mail-cli --lib file_reservations
#   cargo test -p mcp-agent-mail-cli --test it file_reservations_argument_compat::
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reservation-restrictions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reservations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DATABASE_URL: sqlite:///tmp/reservation-regressions.sqlite3
      STORAGE_ROOT: /tmp/reservation-regressions-storage
      HTTP_PORT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install repository-pinned compiler and checks
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Run durable reservation recovery regressions
        run: cargo test --locked -p mcp-agent-mail-tools --lib degraded_intents -- --test-threads=1
      - name: Run public argument-compatibility regressions
        run: cargo test --locked -p mcp-agent-mail-cli --test it file_reservations_argument_compat::
      - name: Run native CLI reservation regressions
        run: cargo test --locked -p mcp-agent-mail-cli --lib file_reservations -- --test-threads=1
      - name: Check production feature graph
        run: cargo check --locked -p mcp-agent-mail-cli --lib --bins
      - name: Check all CLI targets
        run: cargo check --locked -p mcp-agent-mail-cli --all-targets
      - name: Check CLI lints
        run: cargo clippy --locked -p mcp-agent-mail-cli --all-targets -- -D warnings
      - name: Check compatibility-test formatting
        run: rustfmt --check --edition 2024 crates/mcp-agent-mail-cli/tests/file_reservations_argument_compat.rs
