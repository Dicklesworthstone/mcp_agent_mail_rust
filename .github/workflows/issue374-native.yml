name: Issue 374 native reconciliation qualification

on:
  push:
    branches: [main, 'qualification/gh374-*']
    paths:
      - '.github/workflows/issue374-native.yml'
      - 'crates/mcp-agent-mail-db/**'
      - 'crates/mcp-agent-mail-storage/**'
      - 'crates/mcp-agent-mail-server/**'
      - 'crates/mcp-agent-mail-tools/**'
      - 'vendor/sqlmodel-pool/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
  schedule:
    # Temporary hosted-runner opportunity after local dependency builds exhausted
    # memory. The qualification_window job prevents annual native rebuilds.
    - cron: '47 23 3 11 *'

permissions:
  contents: read

concurrency:
  # An expired scheduled run must not replace a queued push or manual request.
  group: issue374-native-${{ github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || 'requested' }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  RUST_TEST_THREADS: '1'

jobs:
  qualification_window:
    name: Check dated qualification trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      run_native: ${{ steps.window.outputs.run_native }}
    steps:
      - id: window
        name: Keep the temporary schedule within 2026
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          run_native=false
          case "$TRIGGER_EVENT" in
            push|workflow_dispatch)
              run_native=true
              ;;
            schedule)
              qualification_year="$(date -u +%Y)"
              if [[ "$qualification_year" == 2026 ]]; then
                run_native=true
              fi
              ;;
          esac
          printf 'run_native=%s\n' "$run_native" >> "$GITHUB_OUTPUT"
          if [[ "$run_native" == false ]]; then
            printf '%s\n' 'Native tests were skipped by the dated trigger guard. This is not qualification evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi

  inbox:
    name: Large inbox exactness and cancellation
    needs: qualification_window
    if: ${{ needs.qualification_window.outputs.run_native == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned native compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gh374-inbox"
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV | tee "$RUNNER_TEMP/gh374-inbox/compiler.log"
      - name: Require cancellation-safe selected pool source
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/gh374-inbox/dependencies.json"
          pool_manifest=$(python3 -c 'import json,sys; packages=[p for p in json.load(open(sys.argv[1]))["packages"] if p["name"] == "sqlmodel-pool"]; assert len(packages) == 1, "qualification requires exactly one resolved sqlmodel-pool"; print(packages[0]["manifest_path"])' "$RUNNER_TEMP/gh374-inbox/dependencies.json")
          # Test the source Cargo actually selected. The retained 0.5.0 vendor
          # backport is historical evidence; current main selects public 0.5.1.
          # A dependency's unit tests require its own workspace/dev dependencies.
          cargo test --locked --manifest-path "$pool_manifest" --lib -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-inbox/pool-unit.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-inbox/pool-unit.log"
      - name: Require cancellation-safe initialization on the runtime pool
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/gh374-inbox/pool-source.json"
          import json, tomllib
          with open("Cargo.toml", "rb") as source:
              manifest = tomllib.load(source)
          with open("Cargo.lock", "rb") as source:
              packages = tomllib.load(source)["package"]
          pools = [package for package in packages if package["name"] == "sqlmodel-pool"]
          if len(pools) != 1:
              raise SystemExit("expected one locked runtime pool; resolve dependency attribution explicitly")
          print(json.dumps({
              "workspace_requirement": manifest["workspace"]["dependencies"]["sqlmodel-pool"],
              "patch": manifest.get("patch", {}).get("crates-io", {}).get("sqlmodel-pool"),
              "locked_package": {key: pools[0].get(key) for key in ("name", "version", "source", "checksum")},
              "scope": "Agent Mail DB and HTTP cancellation tests use this locked graph; vendor/sqlmodel-pool is historical evidence"
          }, indent=2))
          PY
          # Use the selected workspace dependency graph. The historical
          # vendor/sqlmodel-pool copy is no longer the runtime pool. Queued
          # acquisition/dispatch cancellation is also required by the HTTP job.
          cargo test --locked -p mcp-agent-mail-db --lib --no-default-features --features portable pool_impl::tests::cancelled_ -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-inbox/pool.log"
          grep -Eq 'test result: ok\. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-inbox/pool.log"
      - name: Compare exact large inbox results with the incumbent reader
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-db --lib --no-default-features --features portable gh374_ -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-inbox/regressions.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-inbox/regressions.log"
      - name: Run adjacent real inbox correctness tests
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-db --lib --no-default-features --features portable sync::inbox::tests:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-inbox/inbox-suite.log"
          # This adjacent suite has three deliberately opt-in benchmarks. The
          # GH374 step above separately requires every regression to execute.
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; [0-9]+ ignored;' "$RUNNER_TEMP/gh374-inbox/inbox-suite.log"
      - name: Preserve shared inbox paging, obligation counts, and snapshots
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-db --lib --no-default-features --features portable project_mailbox::tests::shared_inbox_ -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-inbox/shared-inbox.log"
          # This family also contains an explicitly ignored scaling benchmark.
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; [0-9]+ ignored;' "$RUNNER_TEMP/gh374-inbox/shared-inbox.log"
          # The obligation-count seek regression is outside shared_inbox_.
          # Require its original 257-delivery paging/count/receipt assertions.
          cargo test --locked -p mcp-agent-mail-db --lib --no-default-features --features portable project_mailbox::tests::project_mailbox_inbox_counts_cross_pages_without_mutating_receipts -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-inbox/shared-obligations.log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-inbox/shared-obligations.log"
      - name: Preserve inbox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gh374-inbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gh374-inbox/
          if-no-files-found: error
          retention-days: 14

  reconciliation:
    name: Native repair fairness, recovery, and convergence
    needs: qualification_window
    if: ${{ needs.qualification_window.outputs.run_native == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned native compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gh374-reconciliation"
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV | tee "$RUNNER_TEMP/gh374-reconciliation/compiler.log"
      - name: Check production storage feature graph
        run: |
          set -euo pipefail
          cargo check --locked -p mcp-agent-mail-storage --lib --no-default-features --features portable 2>&1 | tee "$RUNNER_TEMP/gh374-reconciliation/production.log"
      - name: Run real message reconciliation and checkpoint tests
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --lib --no-default-features --features portable recovery::message_reconcile::database:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-reconciliation/message-recovery.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-reconciliation/message-recovery.log"
      - name: Run cancellable message scans and fail-closed publication tests
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --lib --no-default-features --features portable recovery::message_reconcile::cancellable_tests:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-reconciliation/message-cancellation.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-reconciliation/message-cancellation.log"
      - name: Run native publication admission and cancellation tests
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --lib --no-default-features --features portable recovery::reservation_reconcile::repair_lock::fence::tests:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-reconciliation/fence.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-reconciliation/fence.log"
      - name: Keep active Git writers and unrelated staged authority intact
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --lib --no-default-features --features portable archive_index_sync_ -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-reconciliation/git-index.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-reconciliation/git-index.log"
      - name: Require convergence with competing readers and a live Git process
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --test it --no-default-features --features portable archive::gh374_reconciliation_converges_with_live_git_writer_and_inbox_readers -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-reconciliation/concurrent.log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-reconciliation/concurrent.log"
      - name: Require full 25100-message convergence and responsive large inboxes
        timeout-minutes: 100
        env:
          AM_TEST_GH374_LARGE_MAILBOX: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-storage --test it --no-default-features --features portable archive::gh374_reconciliation_converges_with_live_git_writer_and_inbox_readers -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-reconciliation/concurrent-25100.log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-reconciliation/concurrent-25100.log"
          grep -F '"case":"gh374_real_git_writer_and_inbox_readers"' "$RUNNER_TEMP/gh374-reconciliation/concurrent-25100.log" | grep -F '"large_mailbox":true' | grep -F '"messages":25100'
      - name: Preserve reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gh374-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gh374-reconciliation/
          if-no-files-found: error
          retention-days: 14

  http:
    name: Native HTTP inbox responsiveness and cancellation
    needs: qualification_window
    if: ${{ needs.qualification_window.outputs.run_native == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned native compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gh374-http"
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV | tee "$RUNNER_TEMP/gh374-http/compiler.log"
      - name: Exercise real HTTP inbox reads and cancelled pool admission
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-server --lib --no-default-features --features portable tests::issue374_http:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-http/regressions.log"
          grep -Eq 'test result: ok\. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-http/regressions.log"
      - name: Require responsive HTTP inbox reads during 25100-message reconciliation
        timeout-minutes: 100
        env:
          AM_TEST_GH374_LARGE_MAILBOX: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p mcp-agent-mail-server --lib --no-default-features --features portable tests::issue374_http::gh374_http_inbox_stays_responsive_during_reconciliation -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gh374-http/concurrent-25100.log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/gh374-http/concurrent-25100.log"
          grep -F '"case":"gh374_native_http_reconciliation"' "$RUNNER_TEMP/gh374-http/concurrent-25100.log" | grep -F '"large_mailbox":true' | grep -F '"messages":25100'
      - name: Preserve HTTP qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gh374-http-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gh374-http/
          if-no-files-found: error
          retention-days: 14

  workspace:
    name: Supported workspace qualification
    needs: qualification_window
    if: ${{ needs.qualification_window.outputs.run_native == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned native compiler and checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gh374-workspace"
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc -vV | tee "$RUNNER_TEMP/gh374-workspace/compiler.log"
      - name: Check formatting
        run: |
          set -euo pipefail
          cargo fmt --check 2>&1 | tee "$RUNNER_TEMP/gh374-workspace/format.log"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/gh374-workspace/dependencies.json"
          pool_manifest=$(python3 -c 'import json,sys; packages=[p for p in json.load(open(sys.argv[1]))["packages"] if p["name"] == "sqlmodel-pool"]; assert len(packages) == 1, "qualification requires exactly one resolved sqlmodel-pool"; print(packages[0]["manifest_path"])' "$RUNNER_TEMP/gh374-workspace/dependencies.json")
          cargo fmt --manifest-path "$pool_manifest" --check 2>&1 | tee "$RUNNER_TEMP/gh374-workspace/selected-pool-format.log"
          # Retained historical source; this is not the selected runtime pool.
          rustfmt --edition 2024 --check vendor/sqlmodel-pool/src/lib.rs 2>&1 | tee "$RUNNER_TEMP/gh374-workspace/pool-format.log"
      - name: Check all workspace targets
        if: always()
        run: |
          set -euo pipefail
          cargo check --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/gh374-workspace/all-targets.log"
      - name: Check production feature graph without dev dependencies
        if: always()
        run: |
          set -euo pipefail
          cargo check --locked --workspace --lib --bins 2>&1 | tee "$RUNNER_TEMP/gh374-workspace/production.log"
      - name: Run strict workspace Clippy
        if: always()
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/gh374-workspace/clippy.log"
      - name: Verify qualification left sources unchanged
        if: always()
        run: git diff --exit-code
      - name: Preserve every completed or failed workspace gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gh374-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gh374-workspace/
          if-no-files-found: error
          retention-days: 14
