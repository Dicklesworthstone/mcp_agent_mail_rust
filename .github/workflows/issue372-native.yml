name: Issue 372 native connection memory qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue372-native.yml'
      - '.cargo/**'
      - 'crates/mcp-agent-mail-core/**'
      - 'crates/mcp-agent-mail-db/**'
      - 'crates/mcp-agent-mail-server/**'
      - 'crates/mcp-agent-mail-storage/**'
      - 'crates/mcp-agent-mail-test-helpers/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character lowercase commit SHA in this repository; blank uses the workflow commit'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: issue372-native-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_OPT_LEVEL: '1'
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  CARGO_TERM_COLOR: never
  RUST_TEST_THREADS: '1'
  RUST_BACKTRACE: '1'

jobs:
  native:
    name: Existing mailbox memory and integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/gh372-native
      CARGO_TARGET_DIR: ${{ runner.temp }}/gh372-target
      GH372_DIAGNOSTICS_DIR: ${{ runner.temp }}/gh372-native/connection-maps
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the immutable source before checkout
        id: source
        timeout-minutes: 1
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          tested_sha=${REQUESTED_SOURCE_SHA:-$GITHUB_SHA}
          if [[ ! "$tested_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'source_sha must be exactly 40 lowercase hexadecimal characters or blank.\n' >&2
            exit 1
          fi
          printf 'sha=%s\n' "$tested_sha" >> "$GITHUB_OUTPUT"
          printf 'TESTED_SOURCE_SHA=%s\n' "$tested_sha" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/workflow.sha"
          printf '%s\n' "$tested_sha" > "$EVIDENCE_DIR/tested-source.sha"
          {
            printf '### Issue 372 source qualification\n\n'
            printf -- '- Workflow commit: `%s`\n- Tested commit: `%s`\n\n' "$GITHUB_SHA" "$tested_sha"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 5
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Record exact source and install its pinned compiler
        id: setup
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/source.sha"
          test "$(cat "$EVIDENCE_DIR/source.sha")" = "$TESTED_SOURCE_SHA"
          git status --porcelain --untracked-files=no > "$EVIDENCE_DIR/source-before.txt"
          test ! -s "$EVIDENCE_DIR/source-before.txt"
          cp Cargo.lock "$EVIDENCE_DIR/Cargo.lock"
          cp Cargo.toml "$EVIDENCE_DIR/Cargo.toml"
          cp rust-toolchain.toml "$EVIDENCE_DIR/rust-toolchain.toml"
          sha256sum Cargo.lock Cargo.toml rust-toolchain.toml .cargo/config.toml > "$EVIDENCE_DIR/build-inputs.sha256"
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          printf 'rustup toolchain install %q --profile minimal\n' "$toolchain" > "$EVIDENCE_DIR/compiler.command"
          rustup toolchain install "$toolchain" --profile minimal 2>&1 | tee "$EVIDENCE_DIR/compiler-install.log"
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          {
            uname -a
            id
            rustc +"$toolchain" -vV
            cargo +"$toolchain" -vV
            cat /proc/meminfo
            if [[ -r /sys/fs/cgroup/memory.max ]]; then
              printf 'cgroup_memory_max='
              cat /sys/fs/cgroup/memory.max
            fi
            printf 'CARGO_BUILD_JOBS=%s\nCARGO_INCREMENTAL=%s\n' "$CARGO_BUILD_JOBS" "$CARGO_INCREMENTAL"
            printf 'CARGO_PROFILE_DEV_DEBUG=%s\nCARGO_PROFILE_TEST_DEBUG=%s\n' "$CARGO_PROFILE_DEV_DEBUG" "$CARGO_PROFILE_TEST_DEBUG"
            printf 'CARGO_PROFILE_DEV_OPT_LEVEL=%s\nCARGO_PROFILE_TEST_OPT_LEVEL=%s\n' "$CARGO_PROFILE_DEV_OPT_LEVEL" "$CARGO_PROFILE_TEST_OPT_LEVEL"
            printf 'RUSTFLAGS=%s\nCARGO_ENCODED_RUSTFLAGS=%s\n' "${RUSTFLAGS-}" "${CARGO_ENCODED_RUSTFLAGS-}"
          } | tee "$EVIDENCE_DIR/environment.log"
          cat > "$EVIDENCE_DIR/run-gate.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          gate=$1
          test_name=$2
          # A stuck gate must not prevent the remaining exact tests from running.
          command=(timeout --signal=TERM --kill-after="${GATE_KILL_AFTER:-30s}" "${GATE_TIMEOUT:-6m}" "$TEST_EXECUTABLE" "$test_name" --exact --nocapture --test-threads=1)
          printf '%q ' "${command[@]}" > "$EVIDENCE_DIR/$gate.command"
          printf '\n' >> "$EVIDENCE_DIR/$gate.command"
          set +e
          "${command[@]}" 2>&1 | tee "$EVIDENCE_DIR/$gate.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          # Memory fixtures print child summaries. Only the final parent summary
          # can establish that the requested exact test ran and was not ignored.
          awk '/^test result:/ { result = $0 } END { print result }' "$EVIDENCE_DIR/$gate.log" > "$EVIDENCE_DIR/$gate.result"
          awk 'match($0, /GH372 /) { print substr($0, RSTART) }' "$EVIDENCE_DIR/$gate.log" > "$EVIDENCE_DIR/$gate.measurements.log"
          summary_exit=0
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$EVIDENCE_DIR/$gate.result" || summary_exit=$?
          printf 'command_exit=%s\nlog_exit=%s\nsummary_exit=%s\n' "${statuses[0]}" "${statuses[1]}" "$summary_exit" > "$EVIDENCE_DIR/$gate.status"
          if (( statuses[0] != 0 || statuses[1] != 0 || summary_exit != 0 )); then
            exit 1
          fi
          BASH
      - name: Record whether facade controls apply to the tested source
        id: facade_source
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if [[ -f vendor/fsqlite/Cargo.toml ]]; then
            printf 'present=true\n' >> "$GITHUB_OUTPUT"
            printf 'required: vendored facade controls have not run yet\n' | tee "$EVIDENCE_DIR/facade-qualification.status"
          else
            printf 'present=false\n' >> "$GITHUB_OUTPUT"
            printf 'not applicable: registry baseline\n' | tee "$EVIDENCE_DIR/facade-qualification.status"
            printf '\nFacade controls: not applicable: registry baseline.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the native database integration executable once
        id: build
        timeout-minutes: 130
        run: |
          set -euo pipefail
          command=(cargo test --locked -p mcp-agent-mail-db --no-default-features --test it --no-run --message-format=json-render-diagnostics)
          printf '%q ' "${command[@]}" > "$EVIDENCE_DIR/build.command"
          printf '\n' >> "$EVIDENCE_DIR/build.command"
          set +e
          "${command[@]}" 2>&1 | tee "$EVIDENCE_DIR/build.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'command_exit=%s\nlog_exit=%s\n' "${statuses[@]}" > "$EVIDENCE_DIR/build.status"
          if (( statuses[0] != 0 || statuses[1] != 0 )); then
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          expected_source = (Path(os.environ["GITHUB_WORKSPACE"]) / "crates/mcp-agent-mail-db/tests/it.rs").resolve()
          executables = set()
          artifacts = []
          finished = []
          for line in (evidence / "build.log").read_text().splitlines():
              try:
                  message = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if not isinstance(message, dict):
                  continue
              if message.get("reason") == "build-finished":
                  finished.append(message["success"])
              if message.get("reason") != "compiler-artifact":
                  continue
              artifacts.append(message)
              target = message["target"]
              if (target["name"] == "it" and "test" in target["kind"]
                      and Path(target["src_path"]).resolve() == expected_source
                      and message["profile"]["test"] and message.get("executable")):
                  executables.add(message["executable"])
          (evidence / "compiled-dependencies.json").write_text(json.dumps(artifacts, indent=2) + "\n")
          assert finished == [True], f"unexpected Cargo build completion: {finished}"
          assert len(executables) == 1, f"expected one database integration executable: {executables}"
          executable = Path(executables.pop()).resolve()
          assert executable.is_file() and os.access(executable, os.X_OK), executable
          (evidence / "test-executable.path").write_text(str(executable) + "\n")
          PY
          sha256sum "$(cat "$EVIDENCE_DIR/test-executable.path")" > "$EVIDENCE_DIR/test-executable.sha256"
      - name: Run all five exact memory and integrity gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export TEST_EXECUTABLE="$(cat "$EVIDENCE_DIR/test-executable.path")"
          export CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/crates/mcp-agent-mail-db"
          export LD_LIBRARY_PATH="$(dirname "$TEST_EXECUTABLE"):$(rustc --print target-libdir)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd "$CARGO_MANIFEST_DIR"
          cases=(
            memory-original:startup_page_leak::existing_mailbox_reads_have_bounded_connection_memory
            memory-larger-bodies:startup_page_leak::existing_mailbox_reads_remain_bounded_with_larger_unread_bodies
            snapshots-durability:startup_page_leak::existing_mailbox_readers_preserve_snapshots_and_durable_writes
            index-density:startup_page_leak::descending_metrics_insertions_keep_index_pages_dense
            legacy-compatibility:canonical_schema_readable::canonical_legacy_mailbox_survives_native_upgrade_and_new_writes
          )
          printf 'gate\tresult\texact_test\n' > "$EVIDENCE_DIR/gate-results.tsv"
          failed=0
          for case_name in "${cases[@]}"; do
            gate=${case_name%%:*}
            test_name=${case_name#*:}
            if bash "$EVIDENCE_DIR/run-gate.sh" "$gate" "$test_name"; then
              result=passed
            else
              result=failed
              failed=1
            fi
            printf '%s\t%s\t%s\n' "$gate" "$result" "$test_name" >> "$EVIDENCE_DIR/gate-results.tsv"
          done
          cat "$EVIDENCE_DIR/"*.measurements.log > "$EVIDENCE_DIR/measurements.log"
          cat "$EVIDENCE_DIR/gate-results.tsv" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      # The current workflow supplies the runner even when source_sha selects a
      # candidate whose checked-out workflow predates these facade controls.
      # An application failure must not hide independent facade failures.
      - name: Build the three focused facade test executables once
        id: facade_build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.facade_source.outputs.present == 'true' }}
        timeout-minutes: 40
        run: |
          set -euo pipefail
          facade_evidence="$EVIDENCE_DIR/facade"
          mkdir -p "$facade_evidence"
          cp vendor/fsqlite/Cargo.toml "$facade_evidence/Cargo.toml"
          cp vendor/fsqlite/Cargo.lock "$facade_evidence/Cargo.lock"
          sha256sum vendor/fsqlite/Cargo.toml vendor/fsqlite/Cargo.lock vendor/fsqlite/src/async_api.rs > "$facade_evidence/build-inputs.sha256"
          command=(cargo test --locked --manifest-path vendor/fsqlite/Cargo.toml --features async-api --lib --test async_api_storage_migration --test async_drop_skips_detached_checkpoint --no-run --message-format=json-render-diagnostics)
          printf '%q ' "${command[@]}" > "$facade_evidence/build.command"
          printf '\n' >> "$facade_evidence/build.command"
          set +e
          "${command[@]}" 2>&1 | tee "$facade_evidence/build.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'command_exit=%s\nlog_exit=%s\n' "${statuses[@]}" > "$facade_evidence/build.status"
          if (( statuses[0] != 0 || statuses[1] != 0 )); then
            printf 'failed: facade test executables did not build\n' > "$EVIDENCE_DIR/facade-qualification.status"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"]) / "facade"
          facade = Path(os.environ["GITHUB_WORKSPACE"]) / "vendor/fsqlite"
          expected = {
              "lib": ("fsqlite", "lib", (facade / "src/lib.rs").resolve()),
              "async_api_storage_migration": (
                  "async_api_storage_migration", "test",
                  (facade / "tests/async_api_storage_migration.rs").resolve()),
              "async_drop_skips_detached_checkpoint": (
                  "async_drop_skips_detached_checkpoint", "test",
                  (facade / "tests/async_drop_skips_detached_checkpoint.rs").resolve()),
          }
          executables = {name: set() for name in expected}
          artifacts = []
          finished = []
          with (evidence / "build.log").open() as build_log:
              for line in build_log:
                  try:
                      message = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(message, dict):
                      continue
                  if message.get("reason") == "build-finished":
                      finished.append(message["success"])
                  if message.get("reason") != "compiler-artifact":
                      continue
                  artifacts.append(message)
                  if not message["profile"]["test"] or not message.get("executable"):
                      continue
                  target = message["target"]
                  for name, (target_name, kind, source) in expected.items():
                      if (target["name"] == target_name and kind in target["kind"]
                              and Path(target["src_path"]).resolve() == source):
                          executables[name].add(message["executable"])
          (evidence / "compiled-dependencies.json").write_text(json.dumps(artifacts, indent=2) + "\n")
          assert finished == [True], f"unexpected facade build completion: {finished}"
          for name, matches in executables.items():
              assert len(matches) == 1, f"expected one {name} test executable: {matches}"
              executable = Path(matches.pop()).resolve()
              assert executable.is_file() and os.access(executable, os.X_OK), executable
              (evidence / f"{name}.executable.path").write_text(str(executable) + "\n")
          PY
          for executable_record in "$facade_evidence/"*.executable.path; do
            sha256sum "$(cat "$executable_record")"
          done > "$facade_evidence/test-executables.sha256"
      - name: Run all sixteen exact facade controls
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.facade_build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          gate_runner="$EVIDENCE_DIR/run-gate.sh"
          qualification_status="$EVIDENCE_DIR/facade-qualification.status"
          export EVIDENCE_DIR="$EVIDENCE_DIR/facade"
          export CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/vendor/fsqlite"
          export GATE_TIMEOUT=1m GATE_KILL_AFTER=5s
          export LD_LIBRARY_PATH="$(dirname "$(cat "$EVIDENCE_DIR/lib.executable.path")"):$(rustc --print target-libdir)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd "$CARGO_MANIFEST_DIR"
          cases=(
            lib:gh524_async_open_cancels_worker_waiting_for_another_process
            lib:gh524_async_open_preserves_environment_cancellation_lineage
            lib:gh524_async_open_success_outlives_opening_cancellation_scope
            lib:gh524_async_open_preserves_bootstrap_mask_without_masking_connection
            lib:dropped_open_future_is_nonblocking_and_cleans_once
            lib:inflight_cancellation_interrupts_running_worker_operation
            lib:transaction_state_is_worker_published_when_response_is_abandoned
            lib:synchronous_stream_callback_observes_current_worker_transaction_state
            lib:synchronous_stream_guard_clears_after_callback_error_and_panic
            lib:cleanup_runs_once_for_every_worker_exit
            lib:receiver_drop_panic_cannot_skip_connection_cleanup
            lib:close_without_checkpoint_sync_preserves_wal_and_memoizes
            lib:close_sync_runs_checkpointing_cleanup
            async_api_storage_migration:async_explicit_close_rolls_back_uncommitted_file_transaction
            async_api_storage_migration:sync_drop_rolls_back_uncommitted_file_transaction
            async_drop_skips_detached_checkpoint:readonly_open_must_not_rewrite_main_db
          )
          printf 'gate\tresult\texact_test\n' > "$EVIDENCE_DIR/gate-results.tsv"
          failed=0
          for case_name in "${cases[@]}"; do
            target=${case_name%%:*}
            test_name=${case_name#*:}
            gate=$test_name
            if [[ "$target" == lib ]]; then
              test_name="async_api::tests::$test_name"
            fi
            export TEST_EXECUTABLE="$(cat "$EVIDENCE_DIR/$target.executable.path")"
            if bash "$gate_runner" "$gate" "$test_name"; then
              result=passed
            else
              result=failed
              failed=1
            fi
            printf '%s\t%s\t%s\n' "$gate" "$result" "$test_name" >> "$EVIDENCE_DIR/gate-results.tsv"
          done
          if (( failed )); then
            printf 'failed: one or more facade controls failed\n' > "$qualification_status"
          else
            printf 'passed: all sixteen facade controls completed\n' > "$qualification_status"
          fi
          {
            printf '\n### Facade controls\n\n'
            cat "$qualification_status"
            printf '\n'
            cat "$EVIDENCE_DIR/gate-results.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Verify tracked source stayed unchanged
        if: always()
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/source-after.sha"
          git status --porcelain --untracked-files=no | tee "$EVIDENCE_DIR/source-after.txt"
          git diff --no-ext-diff --exit-code HEAD -- 2>&1 | tee "$EVIDENCE_DIR/source.diff"
          cmp "$EVIDENCE_DIR/source.sha" "$EVIDENCE_DIR/source-after.sha"
          test ! -s "$EVIDENCE_DIR/source-after.txt"
      - name: Preserve commands, memory measurements, and actual failures
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gh372-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
