# .github/workflows/notify-acfs.yml
#
# Notifies ACFS when install.sh changes. This workflow is deliberately
# fail-closed: the release workflow independently refuses to publish until
# ACFS main contains the exact checksum computed here.
#
name: Notify ACFS of Installer Changes

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      # A version change must refresh/reconfirm the ACFS pin even when the
      # installer bytes happen to remain unchanged.
      - 'Cargo.toml'
  workflow_dispatch:

env:
  # Must match the installer key in ACFS checksums.yaml
  TOOL_NAME: "mcp_agent_mail"
  ACFS_REPOSITORY: "Dicklesworthstone/agentic_coding_flywheel_setup"

concurrency:
  group: notify-acfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify-acfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bind notification to the exact installer bytes
        id: installer
        run: |
          set -euo pipefail
          if [[ ! -f install.sh || -L install.sh ]]; then
            echo "::error::install.sh must be a non-symlink regular file"
            exit 1
          fi
          installer_sha256="$(sha256sum install.sh | awk '{print $1}')"
          if ! [[ "$installer_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not compute an exact SHA-256 for install.sh"
            exit 1
          fi
          echo "sha256=$installer_sha256" >> "$GITHUB_OUTPUT"

      - name: Dispatch the exact checksum to ACFS
        env:
          ACFS_TOKEN: ${{ secrets.ACFS_REPO_DISPATCH_TOKEN }}
          INSTALLER_SHA256: ${{ steps.installer.outputs.sha256 }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -z "${ACFS_TOKEN:-}" ]]; then
            echo "::error::ACFS_REPO_DISPATCH_TOKEN is required; refusing to defer checksum authority to a poller"
            exit 1
          fi
          if [[ "$SOURCE_REF" != refs/heads/main ]]; then
            echo "::error::ACFS tracks the public main installer; refusing notification from ${SOURCE_REF}"
            exit 1
          fi
          payload="$(jq -cn \
            --arg tool "$TOOL_NAME" \
            --arg source_repo "$SOURCE_REPOSITORY" \
            --arg ref "$SOURCE_REF" \
            --arg sha "$SOURCE_REVISION" \
            --arg new_sha256 "$INSTALLER_SHA256" \
            '{event_type: "upstream-changed", client_payload: {tool: $tool, source_repo: $source_repo, ref: $ref, sha: $sha, new_sha256: $new_sha256}}')"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${ACFS_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${ACFS_REPOSITORY}/dispatches" \
            --data "$payload"

      - name: Record the release-blocking checksum authority
        run: |
          set -euo pipefail
          {
            echo "## ACFS checksum dispatch"
            echo
            echo "- Tool: \`${TOOL_NAME}\`"
            echo "- Source revision: \`${{ github.sha }}\`"
            echo "- Installer SHA-256: \`${{ steps.installer.outputs.sha256 }}\`"
            echo
            echo "Publication remains blocked until ACFS \`main\` records this exact digest."
          } >> "$GITHUB_STEP_SUMMARY"
