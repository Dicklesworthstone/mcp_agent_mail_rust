name: Land and verify bounded shared acknowledgements

on:
  push:
    branches: [main]
    paths: [.github/workflows/land-atc-reliability-20260918.yml]
permissions: {}
concurrency:
  group: land-shared-ack-20261020
  cancel-in-progress: false
jobs:
  land:
    if: github.repository == 'Dicklesworthstone/mcp_agent_mail_rust' && contains(github.event.head_commit.message, '[land-shared-ack-20261020]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          clean: false
      - name: Land the exact reviewed ACK reader and resource integration
        id: land
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/land-atc-reliability-20260918.yml
          queries=crates/mcp-agent-mail-db/src/queries.rs
          shared=crates/mcp-agent-mail-db/src/project_mailbox.rs
          reader=crates/mcp-agent-mail-db/src/unacked_inbox.rs
          resources=crates/mcp-agent-mail-tools/src/resources.rs
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:$queries)" = 631b45e9cd8f87e833d68a758fff5cafb831e57f
          test "$(git rev-parse HEAD:$shared)" = 1a54d2e1f07711dc72bb39cc143535e5a36b3131
          test "$(git rev-parse HEAD:$resources)" = 07a4549925651b22712ff479da505b1b1921e831
          test "$(git rev-parse "HEAD^:$workflow")" = d0e061884b1e52711bbaa29c804aa78d084e22c6
          test ! -e "$reader"
          original=$(git rev-parse HEAD^)
          packed="$RUNNER_TEMP/shared-ack.patch.gz"
          : > "$packed"
          for blob in 625d4ad5b0c2f80a69503a8278ac6cc96ac0fe4e 294af773f63b67d7b78d0d8f487649676ceb9c41 fb10ff7c0a0f5de3f18940abefc2df24c640e480; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$blob" --jq .content | base64 --decode >> "$packed"
          done
          echo "23ee774127315f809f1a97e31c33801c18a3335bcb69ece6a1cae005ef1a6eb0  $packed" | sha256sum --check
          patch="$RUNNER_TEMP/shared-ack.patch"
          gzip --decompress --stdout "$packed" > "$patch"
          echo "7124a491100c04059989552bcee06f83821b267210df8774efc4c685063e49f0  $patch" | sha256sum --check
          git apply --recount --check "$patch"
          git apply --recount --index --include='crates/mcp-agent-mail-db/src/*' "$patch"
          rustup run stable rustfmt --edition 2024 "$reader"
          for source in "$queries" "$shared"; do
            rustup run stable rustfmt --edition 2024 --config skip_children=true --emit stdout "$source" > /dev/null
          done
          git add -- "$queries" "$shared" "$reader"
          git diff --cached --check
          expected=$(printf '%s\n' "$queries" "$shared" "$reader" | LC_ALL=C sort)
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(db): include shared-project obligations in bounded oldest-first ACK reads' -m 'Replace the direct-only pending acknowledgement helper with snapshot-consistent, join-free direct and shared candidate readers. Scan 256-row direct receipt pages and 128-row shared timestamp pages, complete timestamp ties, retain one globally limited oldest window, and hydrate only selected payloads. Preserve direct precedence even after ACK, per-viewer receipt authority, project scope, registration time and retirement/contact rules. Fail cancelled or uncertain reads without returning partial success. Add the metadata-only inclusive-cutoff API and 21 native regressions. All 41 Python/SQLite tests passed before submission, but those are not native Rust/FrankenSQLite execution; native verification follows in this workflow. No measured production speedup is claimed.'
          git push origin HEAD:refs/heads/main
          printf 'ACK reader commit: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git apply --recount --index --include='crates/mcp-agent-mail-tools/src/resources.rs' "$patch"
          rustup run stable rustfmt --edition 2024 --config skip_children=true --emit stdout "$resources" > /dev/null
          git show "$original:$workflow" > "$workflow"
          git add -- "$resources" "$workflow"
          git diff --cached --check
          expected=$(printf '%s\n' "$resources" "$workflow" | LC_ALL=C sort)
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = "$expected"
          git commit -m 'fix(resources): read stale and overdue ACK metadata without full-body overfetch' -m 'Apply the inclusive age cutoff to both delivery routes before the global oldest-first limit. Use the actual requested limit and the new body-free API for both resource views. Keep per-viewer read state and exact TTL-boundary inclusion. Restore the pre-existing one-shot landing workflow byte-for-byte. Native validation results are recorded separately rather than presumed by this commit.'
          git push origin HEAD:refs/heads/main
          printf 'ACK resources commit: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "landed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve applied sources and patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-ack-applied-sources
          path: |
            crates/mcp-agent-mail-db/src/queries.rs
            crates/mcp-agent-mail-db/src/project_mailbox.rs
            crates/mcp-agent-mail-db/src/unacked_inbox.rs
            crates/mcp-agent-mail-tools/src/resources.rs
            ${{ runner.temp }}/shared-ack.patch
          retention-days: 7
      - name: Check the production database and tools feature graph
        if: steps.land.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 cargo check --locked -p mcp-agent-mail-db -p mcp-agent-mail-tools --lib --no-default-features 2>&1 | tee "$RUNNER_TEMP/shared-ack-production.log"
      - name: Run all native acknowledgement reader regressions
        if: success() && steps.land.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 cargo test --locked -p mcp-agent-mail-db --lib --no-default-features queries::unacked_inbox::tests -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/shared-ack-native.log"
          grep -Eq 'test result: ok\. 21 passed; 0 failed' "$RUNNER_TEMP/shared-ack-native.log"
      - name: Preserve actual native verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-ack-native-verification
          path: ${{ runner.temp }}/shared-ack-*.log
          if-no-files-found: ignore
          retention-days: 7
