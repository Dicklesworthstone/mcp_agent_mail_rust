name: ATC regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atc-regressions.yml'
      - 'crates/mcp-agent-mail-server/src/atc*.rs'
      - 'crates/mcp-agent-mail-server/src/lib.rs'
      - 'crates/mcp-agent-mail-server/tests/*atc*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atc-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DATABASE_URL: sqlite:///tmp/atc-regressions.sqlite3
      STORAGE_ROOT: /tmp/atc-regressions-storage
      HTTP_PORT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install repository-pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version
      - name: Run dependency-free native notification regressions
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 --test crates/mcp-agent-mail-server/src/atc_delivery.rs -o /tmp/atc-delivery-tests
          /tmp/atc-delivery-tests --nocapture
      - uses: Swatinem/rust-cache@v2
      - name: Compile server targets
        run: cargo check --locked -p mcp-agent-mail-server --all-targets
      - name: Run server ATC tests including the admission boundary
        run: cargo test --locked -p mcp-agent-mail-server --lib atc -- --nocapture
      - name: Run real-engine public notification regressions
        run: cargo test --locked -p mcp-agent-mail-server --test atc_notification_admission -- --nocapture
      - name: Verify validation did not rewrite production sources
        run: git diff --exit-code
