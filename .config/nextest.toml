# cargo-nextest configuration for MCP Agent Mail
#
# Primary purpose (br-fec3r): bound the worst case for any individual test so a
# wedged/hung test binary can NEVER survive as a multi-day PPID=1 orphan.
#
# Background: when `cargo test` is interrupted (Ctrl-C, supervisor kill, fleet
# cleanup), cargo does not propagate the signal to the spawned test binary. If a
# test happens to be blocked at that instant — e.g. a degraded fleet host puts a
# pool/fsync/flock syscall into uninterruptible (D) state — the orphaned test
# binary keeps running and holding RAM for days. The 2026-05-08 fleet sweep found
# 8-day-old `mcp_agent_mail_tools` orphans across two hosts.
#
# This repo's test code is provably free of *unbounded* hangs: every tool-layer
# retry loop is bounded (<=4 attempts), the DB MVCC retry budget is bounded
# (~29s), the pool busy_timeout is bounded (60s), and unit tests use per-test
# isolated databases (`:memory:` or a fresh tempdir) so there is no cross-test
# shared-DB deadlock. The remaining risk is therefore environmental, not a code
# defect — exactly the case a runner-level watchdog is meant to cover.
#
# cargo-nextest runs each test in its OWN process (and, on Unix, its own process
# group). `slow-timeout.terminate-after` makes nextest send SIGTERM and then,
# after `grace-period`, SIGKILL to that whole process group when a test exceeds
# the budget. That converts "orphan survives for days" into "killed after a few
# minutes", and the SIGKILL-to-process-group reaches even a wedged child that an
# in-binary signal handler could never rescue. Run the orphan-prone suites with
# `cargo nextest run` (the fleet/rch toolchain already supports it) to get this
# guardrail; plain `cargo test` has no equivalent knob.

[profile.default]
# Warn that a test is "slow" once per minute, and hard-terminate it after four
# such periods (~4 minutes). The slowest *legitimate* test path here is a write
# under maximal lock contention (pool busy_timeout 60s + bounded MVCC/tool
# retries), comfortably under one minute, so 4 minutes never trips a real test
# while still bounding a genuine hang to minutes instead of days.
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "10s" }

# A leaked subprocess that keeps a test's stdout/stderr pipe open also blocks
# nextest from reaping the test; fail such a test instead of waiting forever.
leak-timeout = "1s"

# Known-slow exception (br-54b92): the ATC rollup *property* test runs its full
# proptest case set against a file-backed DB and legitimately takes ~4 minutes
# wall-clock — it is I/O-bound (per-case fsync across the case set), not hung
# (the proptest case count and every DB op it performs are bounded). That trips
# the blanket 4-minute kill above, reporting a passing test as TIMEOUT. Give just
# this test a longer leash so the suite stays green under nextest, while still
# bounding a genuine hang to ~8 minutes rather than days. The fix is the runner
# budget, NOT reducing the property test's coverage.
[[profile.default.overrides]]
filter = 'test(refresh_rollups_conserves_counts)'
slow-timeout = { period = "120s", terminate-after = 4, grace-period = "10s" }

# This artifact-contract test intentionally runs the complete Git-backed archive
# profile (102 measured batches plus warmups, up to 1,000 messages per batch).
# On a contended release host it completes in roughly 7.5 minutes, so retain a
# finite watchdog while keeping the blanket four-minute policy for normal tests.
[[profile.default.overrides]]
filter = 'test(archive_perf_profile_run_emits_extended_artifacts)'
slow-timeout = { period = "180s", terminate-after = 5, grace-period = "10s" }

# The SQLite bind-chunk boundary test creates SQLITE_MAX_BIND_PARAMS + 1
# (1,000) agents one write-transaction at a time before the chunked insert it
# actually exercises. Under the fsqlite 0.3.4 engine those seed writes take
# ~8-10 minutes wall-clock on a contended host — I/O-bound and fully bounded,
# not hung. Keep a finite watchdog above that budget.
[[profile.default.overrides]]
filter = 'test(create_message_with_recipients_rebuilds_inbox_stats_across_sqlite_bind_chunks)'
slow-timeout = { period = "180s", terminate-after = 6, grace-period = "10s" }

# ---------------------------------------------------------------------------
# Load-lab / latency-measurement isolation (2026-08-18)
#
# These suites assert wall-clock latency percentiles, drive deliberate
# thundering-herd contention against their own private DB, or measure SLO
# artifacts. Running them WHILE the rest of the ~16k-test suite saturates
# every hardware thread does not measure the code — it measures the host's
# scheduler under oversubscription (observed: pool-acquire p95 of 524ms under
# a full parallel run vs sub-ms alone; spin-executor hang detectors firing at
# 60s on writes that take 2s alone). `threads-required = "num-test-threads"`
# makes nextest schedule each of these tests with the entire thread budget
# reserved, i.e. effectively alone, so their latency assertions measure the
# code on an unloaded machine — the same environment their budgets were
# calibrated against. This costs serial wall-clock only for this short list.
# ---------------------------------------------------------------------------
[[profile.default.overrides]]
filter = '''
binary_id(mcp-agent-mail-storage::stress_pipeline)
| binary_id(mcp-agent-mail-storage::stress_pipeline_known_bad_git)
| binary_id(mcp-agent-mail-db::load_concurrency)
| binary_id(mcp-agent-mail-db::load_bench)
| binary_id(mcp-agent-mail-db::stress)
| test(native_http_transport_gate)
| test(native_share_archive_transport_gate)
| test(native_tui_transport_gate)
| test(native_security_privacy_gate)
| test(rapid_key_sequences_no_panic)
| binary_id(mcp-agent-mail-server::tui_perf_baselines)
| binary_id(mcp-agent-mail-server::golden_snapshots)
'''
threads-required = "num-test-threads"

# Two labs need more than the 10-minute leash even in isolation: the
# 120-agent multi-project pipeline (4x the 30-agent lab's work at ~40s p99
# per wave), and the TUI transport gate, whose e2e adapter enforces its own
# 1200s internal timeout — the runner watchdog must sit ABOVE that so the
# adapter's graceful failure (with artifacts) wins over a SIGKILL.
# NOTE: nextest applies the FIRST matching override per key, so this
# specific rule must precede the binary-wide 120s rule below.
[[profile.default.overrides]]
filter = 'test(stress_multi_project_120_agents) | test(native_tui_transport_gate)'
slow-timeout = { period = "300s", terminate-after = 5, grace-period = "15s" }

# The pipeline/load labs legitimately run for minutes even on an idle host
# under the registry fsqlite engine (the 30-agent DB+Git pipeline alone
# delivers p99 ≈ 40s per message wave). Give them a watchdog sized for the
# isolated-run reality — still finite, so a genuine hang dies in minutes.
[[profile.default.overrides]]
filter = '''
binary_id(mcp-agent-mail-storage::stress_pipeline)
| binary_id(mcp-agent-mail-storage::stress_pipeline_known_bad_git)
| test(swarm_load_lab_ci_smoke_writes_slo_artifacts)
| test(native_http_transport_gate)
| test(native_share_archive_transport_gate)
'''
slow-timeout = { period = "120s", terminate-after = 5, grace-period = "10s" }

# CI profile inherits the same protections with a shorter slow-warning cadence
# and an automatic single retry for flakes, while keeping the same hard kill.
[profile.ci]
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "10s" }
leak-timeout = "1s"
retries = 1
fail-fast = false

# Same known-slow exception under CI (per-profile; overrides do not inherit).
[[profile.ci.overrides]]
filter = 'test(refresh_rollups_conserves_counts)'
slow-timeout = { period = "120s", terminate-after = 4, grace-period = "10s" }

[[profile.ci.overrides]]
filter = 'test(archive_perf_profile_run_emits_extended_artifacts)'
slow-timeout = { period = "180s", terminate-after = 5, grace-period = "10s" }

[[profile.ci.overrides]]
filter = 'test(create_message_with_recipients_rebuilds_inbox_stats_across_sqlite_bind_chunks)'
slow-timeout = { period = "180s", terminate-after = 6, grace-period = "10s" }

# Same load-lab isolation + watchdogs under CI (overrides do not inherit).
[[profile.ci.overrides]]
filter = '''
binary_id(mcp-agent-mail-storage::stress_pipeline)
| binary_id(mcp-agent-mail-storage::stress_pipeline_known_bad_git)
| binary_id(mcp-agent-mail-db::load_concurrency)
| binary_id(mcp-agent-mail-db::load_bench)
| binary_id(mcp-agent-mail-db::stress)
| test(native_http_transport_gate)
| test(native_share_archive_transport_gate)
| test(native_tui_transport_gate)
| test(native_security_privacy_gate)
| test(rapid_key_sequences_no_panic)
| binary_id(mcp-agent-mail-server::tui_perf_baselines)
| binary_id(mcp-agent-mail-server::golden_snapshots)
'''
threads-required = "num-test-threads"

# First-match precedence: specific long-lab rule before the binary-wide rule.
[[profile.ci.overrides]]
filter = 'test(stress_multi_project_120_agents) | test(native_tui_transport_gate)'
slow-timeout = { period = "300s", terminate-after = 5, grace-period = "15s" }

[[profile.ci.overrides]]
filter = '''
binary_id(mcp-agent-mail-storage::stress_pipeline)
| binary_id(mcp-agent-mail-storage::stress_pipeline_known_bad_git)
| test(swarm_load_lab_ci_smoke_writes_slo_artifacts)
| test(native_http_transport_gate)
| test(native_share_archive_transport_gate)
'''
slow-timeout = { period = "120s", terminate-after = 5, grace-period = "10s" }
