[workspace]
resolver = "2"
members = [
  "crates/mcp-agent-mail",
  "crates/mcp-agent-mail-core",
  "crates/mcp-agent-mail-db",
  "crates/mcp-agent-mail-storage",
  "crates/mcp-agent-mail-server",
  "crates/mcp-agent-mail-tools",
  "crates/mcp-agent-mail-cli",
  "crates/mcp-agent-mail-guard",
  "crates/mcp-agent-mail-share",
  "crates/mcp-agent-mail-conformance",
  "crates/mcp-agent-mail-search-core",
  "crates/mcp-agent-mail-test-helpers",
]
exclude = ["experimental/*", "crates/mcp-agent-mail-dashboard-wasm"]

[workspace.package]
version = "0.3.36"
edition = "2024"
license = "LicenseRef-MIT-Rider"
license-file = "LICENSE"
rust-version = "1.100"
repository = "https://github.com/Dicklesworthstone/mcp_agent_mail_rust"
authors = ["Jeff Emanuel"]

[workspace.dependencies]
# Required internal dependencies (local projects)
fastmcp = { version = "0.10.0", package = "fastmcp-rust" }
fastmcp-core = "0.10.0"
fastmcp-server = "0.10.0"
fastmcp-transport = "0.10.0"
fastmcp-protocol = "0.10.0"

# br-5lgwn: the mailbox engine, SQLModel and FastMCP share Asupersync 0.5.
# The embedded Beads library retains its older private runtime graph.
asupersync = { version = "=0.5.0", features = ["tls-webpki-roots"] }
fsqlite = "=0.4.4"
fsqlite-types = "=0.4.4"

sqlmodel = "=0.5.0"
sqlmodel-core = "=0.5.0"
sqlmodel-query = "=0.5.0"
sqlmodel-schema = "=0.5.0"
sqlmodel-session = "=0.5.0"
sqlmodel-pool = "=0.5.0"
sqlmodel-frankensqlite = "=0.5.0"
sqlmodel-sqlite = "=0.5.0"

ftui = "0.5.0"
ftui-runtime = { version = "0.5.0" }
ftui-extras = { version = "0.5.0", features = ["theme", "syntax", "export", "markdown", "charts", "text-effects", "diagram", "forms", "clipboard", "image", "visual-fx"] }
ftui-widgets = { version = "0.5.0", features = ["debug-overlay", "regex-search"] }
ftui-tty = "0.5.0"
ftui-harness = "0.5.0"
ftui-render = "0.5.0"
beads_rust = { version = "=0.6.0", default-features = false }
toon = { version = "0.2.4", package = "tru" }
# GH#161: global allocator for the long-running serve-http daemon to avoid
# glibc per-thread arena fragmentation (multi-GB retained RSS under load).
mimalloc = "0.1"

# Internal workspace crates
mcp-agent-mail-core = { path = "crates/mcp-agent-mail-core" }
mcp-agent-mail-db = { path = "crates/mcp-agent-mail-db", default-features = false }
mcp-agent-mail-storage = { path = "crates/mcp-agent-mail-storage", default-features = false }
mcp-agent-mail-server = { path = "crates/mcp-agent-mail-server", default-features = false }
mcp-agent-mail-tools = { path = "crates/mcp-agent-mail-tools", default-features = false }
mcp-agent-mail-cli = { path = "crates/mcp-agent-mail-cli", default-features = false }
mcp-agent-mail-guard = { path = "crates/mcp-agent-mail-guard" }
mcp-agent-mail-share = { path = "crates/mcp-agent-mail-share", default-features = false }
mcp-agent-mail-conformance = { path = "crates/mcp-agent-mail-conformance" }
mcp-agent-mail-search-core = { path = "crates/mcp-agent-mail-search-core" }
mcp-agent-mail-test-helpers = { path = "crates/mcp-agent-mail-test-helpers" }

# Core ecosystem deps
franken-agent-detection = "0.2.2"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9.42"
toml = "1.1.2"
toml_edit = "0.25"
json5 = "1.3.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
web-time = "1.1.0"
comrak = { version = "0.55.0", default-features = false }
include_dir = "0.7.4"
minijinja = "2.15.1"
ammonia = "4.2.0"
regex = "1"
unicode-normalization = "0.1"
same-file = "1"
similar = "3.1.1"
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }
glob = "0.3.3"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4"
base64 = "0.23"
ed25519-dalek = "3"
blake2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
criterion = { version = "0.8", features = ["html_reports"] }
loom = "0.7"
proptest = "1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
fs2 = "0.4"
walkdir = "2"
# Tantivy 0.26.1 pins lru 0.16.x, which is affected by RUSTSEC-2026-0253.
# The direct index uses this immutable 0.27 commit with lru 0.18.2;
# FrankenSearch still has its separate registry Tantivy dependency.
tantivy = { git = "https://github.com/quickwit-oss/tantivy", rev = "1f32c1a8af0eb9d68bd3f5576caf20941364b657" }
indexmap = "2"
nix = "0.31.3"
rustix = { version = "1.1.4", features = ["fs"] }
url = "2.5.8"
signal-hook = "0.4.4"
winsafe = { version = "=0.0.28", features = ["kernel"] }
# Windows stdout readiness without reader threads or optional async adapters.
socketpair = { version = "=0.19.8", default-features = false }

# frankensearch: two-tier hybrid search engine + optional cross-encoder rerank.
#
# Do not enable frankensearch's aggregate `hybrid`/`semantic` features here:
# those currently include FastEmbed, which pulls hf-hub/reqwest/hyper/tokio.
# Downstream crates opt into the exact no-Tokio subfeatures they need.
#
# Pin Cargo's source itself: a sibling clone can drift even when its directory
# is named after a release (GH325). Keep this revision aligned with dist.yml's
# FRANKENSEARCH_COMMIT and the container/source-installer provenance record.
# The reranker consumes the caller's Cx, so its runtime must move together
# with SQLModel and FastMCP to Asupersync 0.5.
frankensearch = { version = "0.6.0", git = "https://github.com/Dicklesworthstone/frankensearch", rev = "dd093fb230404ab08be2ed6f27776ed6c4796485", default-features = false, features = ["lexical-tantivy"] }
frankensearch-core = { version = "0.3.0", git = "https://github.com/Dicklesworthstone/frankensearch", rev = "dd093fb230404ab08be2ed6f27776ed6c4796485" }
frankensearch-embed = { version = "0.3.0", git = "https://github.com/Dicklesworthstone/frankensearch", rev = "dd093fb230404ab08be2ed6f27776ed6c4796485", default-features = false }
frankensearch-index = { version = "0.3.0", git = "https://github.com/Dicklesworthstone/frankensearch", rev = "dd093fb230404ab08be2ed6f27776ed6c4796485" }
frankensearch-fusion = { version = "0.3.0", git = "https://github.com/Dicklesworthstone/frankensearch", rev = "dd093fb230404ab08be2ed6f27776ed6c4796485" }

# Two-tier search dependencies (legacy, being replaced by frankensearch)
half = "2"
wide = "1.5.0"
safetensors = "0.8"
tokenizers = "0.23.1"
rayon = "1"
dirs = "6"
smallvec = { version = "1", features = ["serde"] }

# WASM dependencies
serde-wasm-bindgen = "0.6"

[workspace.lints.rust]
# Every crate root still carries `#![forbid(unsafe_code)]`, which is what keeps
# library and binary code unsafe-free. The workspace table says `deny` rather
# than `forbid` so that integration-test files which must mutate the process
# environment (Rust 2024 makes `std::env::set_var` unsafe) can opt in with an
# explicit `#![allow(unsafe_code)]` while still inheriting the shared lints;
# `forbid` cannot be overridden and would make those crates unable to inherit
# this table at all (br-sox5q).
unsafe_code = "deny"
# guard and storage carry cfg(fuzzing)-gated hooks; declare the cfg once here.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow early development lints
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# ── Build profiles ──────────────────────────────────────────────────────────

[profile.dev]
opt-level = 1            # Slight optimization for faster test execution
debug = 2                # Full debug info for development

[profile.release]
lto = "thin"             # Cross-crate optimization (80% of full LTO, much faster compile)
codegen-units = 1        # Single codegen unit for maximum optimization
panic = "unwind"         # Keep long-running server workers from aborting the process on panics
opt-level = 3            # Maximum optimization for speed
strip = "symbols"        # Remove debug symbols from production binary

[profile.bench]
inherits = "release"     # Benchmarks use same optimizations as release

[patch.crates-io]
# Preserve GH321 proposal negotiation on FastMCP's Asupersync 0.5 line;
# registry 0.10.0 predates this fix. Keep all framework crates together.
fastmcp-rust = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c2e5e4b61a839ebcc430e7bacbc94d4d3205102" }
fastmcp-core = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c2e5e4b61a839ebcc430e7bacbc94d4d3205102" }
fastmcp-server = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c2e5e4b61a839ebcc430e7bacbc94d4d3205102" }
fastmcp-transport = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c2e5e4b61a839ebcc430e7bacbc94d4d3205102" }
fastmcp-protocol = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c2e5e4b61a839ebcc430e7bacbc94d4d3205102" }
fastmcp-console = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c2e5e4b61a839ebcc430e7bacbc94d4d3205102" }
fastmcp-client = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c2e5e4b61a839ebcc430e7bacbc94d4d3205102" }
fastmcp-derive = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c2e5e4b61a839ebcc430e7bacbc94d4d3205102" }
# Beads 0.5.4 still embeds the 0.3 engine. Preserve its qualified WAL,
# read-only snapshot, DDL, prepared binding and Windows identity fixes.
# The mailbox uses the separate 0.4.4 compatibility revision below.
fsqlite = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-ast = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-btree = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-core = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-error = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-ext-fts5 = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-ext-icu = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-ext-json = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-ext-misc = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-ext-rtree = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-func = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-mvcc = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-observability = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-pager = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-parser = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-planner = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-types = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-vdbe = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-vfs = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
fsqlite-wal = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "2633b38a26bde68db23172b12aa402ed698cc309" }
# v0.4.4 omitted c76b22's prepared-DML binding and CREATE-prefix repairs.
# Preserve the reproduced recipient UPDATE fix on the exact release base.
# Package aliases let Beads retain its independently versioned 0.3 family.
# Retain NOCASE ordering, INSERT SELECT UPSERT bindings, and bounded Linux descriptors.
fsqlite-044 = { package = "fsqlite", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-ast-044 = { package = "fsqlite-ast", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-btree-044 = { package = "fsqlite-btree", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-core-044 = { package = "fsqlite-core", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-error-044 = { package = "fsqlite-error", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-ext-fts5-044 = { package = "fsqlite-ext-fts5", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-ext-icu-044 = { package = "fsqlite-ext-icu", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-ext-json-044 = { package = "fsqlite-ext-json", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-ext-misc-044 = { package = "fsqlite-ext-misc", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-ext-rtree-044 = { package = "fsqlite-ext-rtree", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-func-044 = { package = "fsqlite-func", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-mvcc-044 = { package = "fsqlite-mvcc", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-observability-044 = { package = "fsqlite-observability", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-pager-044 = { package = "fsqlite-pager", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-parser-044 = { package = "fsqlite-parser", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-planner-044 = { package = "fsqlite-planner", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-types-044 = { package = "fsqlite-types", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-vdbe-044 = { package = "fsqlite-vdbe", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-vfs-044 = { package = "fsqlite-vfs", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
fsqlite-wal-044 = { package = "fsqlite-wal", git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "db458bfba780e79d099d9f8986da5a1f7b360901" }
# The mailbox runtime uses registry Asupersync 0.5.0, SQLModel 0.5.0,
# patched FrankenSQLite 0.4.4 and pinned FastMCP 0.10.0.
# No mutable sibling checkout is required.
#
# beads_rust =0.6.0 is published and resolves from crates.io. Do not patch it
# to a mutable sibling: even an unused patch adds that checkout to remote
# source discovery, and a matching sibling version changes locked resolution.
# ftui 0.5.0, franken-agent-detection 0.2.2, and tru 0.2.4 resolve from
# crates.io. Their former path patches made builds depend on whatever state
# each machine's sibling checkout happened to be in.
# rich_rust resolves from the registry; no local console patch is required.

# --- rch OOM mitigation (2026-07-23) ---------------------------------------
# The 31k-line mcp-agent-mail-server crate needs ~7-10GB/rustc and OOM-kills the
# 15-29GB rch workers, so rch fails the remote build and falls back to a LOCAL
# compile on the trj orchestrator (load spikes + /data/tmp ENOSPC). These per-
# package overrides cut per-rustc peak memory so it builds on the small workers
# instead of flooding trj. Revert = delete this block.
[profile.release.package."mcp-agent-mail-server"]
codegen-units = 16

[profile.dev.package."mcp-agent-mail-server"]
debug = 1
