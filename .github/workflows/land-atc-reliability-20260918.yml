name: Land verified GH355 snapshot authority fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/land-atc-reliability-20260918.yml]
permissions: {}
concurrency:
  group: land-gh355-core-20261016
  cancel-in-progress: false
jobs:
  land:
    if: github.repository == 'Dicklesworthstone/mcp_agent_mail_rust' && contains(github.event.head_commit.message, '[land-gh355-core-20261016]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          clean: false
      - name: Verify exact tested patch and apply with no force push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/land-atc-reliability-20260918.yml
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:crates/mcp-agent-mail-db/src/pool.rs)" = 6dcfb4b1d0c3ec6eeae4a3aec1dbfb5c321f83a5
          test "$(git rev-parse HEAD:crates/mcp-agent-mail-db/src/snapshot.rs)" = 76c12c12e02fbdba45edcfaebfb25c3a3ac1aa68
          test "$(git rev-parse "HEAD^:$workflow")" = a2f02267589a9a69e474d26cd5124314cf3ad9b8
          gh api repos/Dicklesworthstone/mcp_agent_mail_rust/git/blobs/92fa740c40d997bd80647ae9c3cec62f2b6f6309 > "$RUNNER_TEMP/gh355-core.json"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          record = json.loads((root / 'gh355-core.json').read_text())
          packed = base64.b64decode(record['content'])
          assert len(packed) == 10008
          assert hashlib.sha1(f'blob {len(packed)}\0'.encode() + packed).hexdigest() == '92fa740c40d997bd80647ae9c3cec62f2b6f6309'
          patch = lzma.decompress(packed)
          assert len(patch) == 43669
          assert hashlib.sha256(patch).hexdigest() == '9892fd4a0fd9d6689fe945fc26584a3a75a1196b1d0cd39a15806d05dc9740ed'
          (root / 'gh355-core.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/gh355-core.patch"
          git apply --index "$RUNNER_TEMP/gh355-core.patch"
          git show "HEAD^:$workflow" > "$workflow"
          git add -- "$workflow"
          git diff --cached --check
          expected=$(printf '%s\n' "$workflow" crates/mcp-agent-mail-db/src/pool.rs crates/mcp-agent-mail-db/src/snapshot.rs crates/mcp-agent-mail-db/src/snapshot_authority.rs crates/mcp-agent-mail-db/tests/fixtures/snapshot-v0.3.30.json crates/mcp-agent-mail-db/tests/fixtures/snapshot-v0.3.30.README.md | LC_ALL=C sort)
          actual=$(git diff --cached --name-only | LC_ALL=C sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(snapshot): migrate corroborated legacy authority and stop blocked exports (GH355)' -m 'Preserve legacy JSON durably; require strict namespace, complete legacy shape, fresh full integrity and unique byte identity. Reject foreign, malformed, ambiguous, symlinked and hard-linked authority candidates. Gate both producer routes before staging; support explicit evidence-preserving legacy candidate selection. Serialize metadata publication and compare exact revisions. Verified in isolated pinned-nightly build: snapshot 31, backup 44, recovery_retention 58, integrity 101, recovery 224 tests passed (filters overlap). Restore the original one-shot workflow verbatim.'
          git push origin HEAD:refs/heads/main
          printf 'Landed %s\n' "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
